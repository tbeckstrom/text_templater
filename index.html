<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Templater</title>

  <!-- Trunk builds the app from these (see "Running in a browser" in the README). -->
  <link data-trunk rel="rust" data-bin="text_templater" data-wasm-opt="2">
  <link data-trunk rel="copy-file" href="web/_headers">

  <style>
    :root { color-scheme: light dark; --bg: #1b1b1b; --fg: #b0b0b0; }
    @media (prefers-color-scheme: light) { :root { --bg: #f8f8f8; --fg: #505050; } }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
    #app { position: absolute; inset: 0; width: 100%; height: 100%; }
    #status {
      position: absolute; inset: 0; display: grid; place-items: center; margin: 0;
      font: 16px system-ui, sans-serif; color: var(--fg); pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <p id="status">Loading Note Templater...</p>
  <noscript><p>Note Templater needs JavaScript enabled.</p></noscript>
</body>
</html>
