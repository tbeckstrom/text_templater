# --- Per-tooth diagnosis: driven by the `diagnosis_teeth` multiselect, so
# --- picking teeth up top creates exactly one diagnosis row per tooth.
[[groups]]
key = "tooth_diagnoses"
label = "Diagnosis"
source = "diagnosis_teeth"
source_as = "tooth"

[[groups.fields]]
key = "diagnosis"
label = "Diagnosis"
type = "multiselect"
required = true
options = ["symptomatic", "carious", "periodontally compromised", "PBI", "CBI", "soft tissue impacted", "malposed"]

# --- Procedure blocks: one per tooth/area worked on. Each block carries its
# --- own speed buttons, which fill in only that block.
[[groups]]
key = "blocks"
label = "Procedure Block"

[[groups.speed_buttons]]
