id = "oms_procedure_note"
name = "OMS Procedure Note"
description = "Oral and maxillofacial surgery clinic procedure note"

# The whole procedure-block section — its group, fields and per-block speed
# buttons — lives in partials/procedure_blocks.toml and is pulled in here.
use_partials = ["procedure_blocks"]

# NOTE: `body` must come before any [[fields]] / [[groups]] / [[speed_buttons]]
# blocks below — in TOML, keys written after an array-of-tables attach to the
# last table entry, not the document root.
#
# Conventions used throughout:
#   * Choice lists carry their own prose via `text = ...`, so the template
#     just prints `<field>_text` instead of restating every sentence here.
#     Expansions always come out in declared option order.
#   * `{{<and_list items=.../>}}` joins a list as "a, b and c".
#   * `[[each]]` / `[[s]]` in a procedure block's prose are swapped for
#     "each"/"the" and "s"/"" depending on that block's `multiple_teeth`.
body = """
{%- component and_list(items) %}{% for item in items %}{{ item }}{% if not loop.last %}{% if loop.index == items | length - 1 %} and {% else %}, {% endif %}{% endif %}{% endfor %}{% endcomponent and_list -%}
**ORAL AND MAXILLOFACIAL SURGERY PROCEDURE NOTE**

**PREPROCEDURE DIAGNOSIS:**
{% for t in tooth_diagnoses %}Tooth {{ t.tooth }} - {{ t.diagnosis | join(sep=", ") }}
{% endfor %}
{%- if carious_teeth %}Carious, hopeless {{ "teeth" if carious_teeth | length > 1 else "tooth" }} {{ carious_teeth | join(sep=", ") }}
{% endif %}
{%- if diagnoses_free_text %}{{ diagnoses_free_text }}
{% endif %}
**POSTPROCEDURE DIAGNOSIS:**
Same as preoperative

**PROCEDURE:**
{% if ext %}Extraction of {{ "teeth" if ext | length > 1 else "tooth" }} {{ ext | join(sep=", ") }}
{% endif %}
{%- if coronectomy %}Coronectomy of {{ "teeth" if coronectomy | length > 1 else "tooth" }} {{ coronectomy | join(sep=", ") }}
{% endif %}
{%- if alveoloplasty %}Alveoloplasty of {{ alveoloplasty_quadrants }}
{% endif %}
{%- if biopsy %}Biopsy of {{ biopsy_site }}
{% endif %}
**SURGEON:**
Thomas Beckstrom DDS, MD

**ANESTHESIA:**
{% if ivga %}GA sedation (total anesthesia time = {{ ga_time }} minutes), see anesthesia records for full report
{% endif %}
{%- if nitrous_used %}Anxiolysis with N2O/O2
{% endif %}
Local anesthesia with:
{% if "Lidocaine 2% w/ epi" in local_used %}1.7mL 2% lidocaine with 1:100,000 epinephrine x {{ lidocaine_carps }} {% if lidocaine_carps > 1 %}carpules{% else %}carpule{% endif %}
{% endif %}
{%- if "Bupivacaine 0.5% w/ epi" in local_used %}1.7mL 0.5% bupivacaine with 1:200,000 epinephrine x {{ bupivacaine_carps }} {% if bupivacaine_carps > 1 %}carpules{% else %}carpule{% endif %}
{% endif %}
{%- if "Articaine 4% w/ epi" in local_used %}1.7mL 4% articaine with 1:200,000 epinephrine x {{ articaine_carps }} {% if articaine_carps > 1 %}carpules{% else %}carpule{% endif %}
{% endif %}
{%- if "Mepivacaine plain" in local_used %}1.7mL 3% mepivacaine plain x {{ mepivacaine_carps }} {% if mepivacaine_carps > 1 %}carpules{% else %}carpule{% endif %}
{% endif %}
{%- if "Topical" in local_used %}Topical anesthetic applied prior to injections
{% endif %}
**SPECIMEN:**
{% if ext %}Dentition for disposal
{% endif %}
{%- if biopsy %}{{ biopsy_site }}
{% endif %}
{%- if ivga %}
ASA: {{ asa }}
{% endif %}
**VITALS:**
{% if ivga %}See anesthesia record for details
{% else %}BP: {{ bp }}, HR: {{ hr }}
{% endif %}
**HISTORY AND INDICATIONS:**
{{ pt_age }} yo {{ pt_sex }} {% if pmh %}with PMH {{ pmh | trim | split(pat="\\n") | join(sep=", ") }} {% endif %}presenting with the following:

{% for t in tooth_diagnoses %}Tooth {{ t.tooth }} - {{ t.diagnosis | join(sep=", ") }}
{% endfor %}
{%- if carious_teeth %}Carious, hopeless {{ "teeth" if carious_teeth | length > 1 else "tooth" }} {{ carious_teeth | join(sep=", ") }}
{% endif %}
{%- if diagnoses_free_text %}{{ diagnoses_free_text }}
{% endif %}
{% if coronectomy and coronectomy_indications_text %}Coronectomy as above indicated {{<and_list items={coronectomy_indications_text}/>}}. {% endif %}
{%- if ext and ext_indications_text %}Extractions as above are indicated {{<and_list items={ext_indications_text}/>}}. {% endif %}
{%- if alveoloplasty and alveoloplasty_indications_text %}Alveoloplasty as above is indicated {{<and_list items={alveoloplasty_indications_text}/>}}. {% endif %}
{%- if biopsy %}Biopsy as above indicated to characterize the lesion and guide appropriate treatment planning. {% endif %}

The health history and indications for the operation were reviewed and an examination was performed. {% set unchanged = ["health history" if not ("history" in interval_changes) else "", "exam" if not ("exam" in interval_changes) else "", "treatment plan" if not ("treatment plan" in interval_changes) else ""] %}{% set unchanged = [u for u in unchanged if u != ""] %}{% if unchanged %}There have been no changes in the {{<and_list items={unchanged}/>}} since the last visit. {% endif %}{% if "history" in interval_changes %}The patient reports interval changes to health history including {{ history_changes }}. {% endif %}{% if "exam" in interval_changes %}Exam today notable for {{ exam_changes }}. {% endif %}{% if "treatment plan" in interval_changes %}We discussed the following changes to the treatment plan: {{ treatment_plan_changes }}. {% endif %}{% if decision_maker != "patient" %}Confirmed the plan of treatment with the {{ decision_maker }}. {% endif %}We again reviewed the details of the procedure and R/B/A, all questions invited and answered prior to starting. Informed consent obtained.{% if ivga %} NPO status confirmed.{% if pt_sex == "female" and pt_age < 50 %} Denies pregnancy.{% endif %}{% endif %}
{% if auscultated_heart_lungs %}
Heart and lungs auscultated prior to beginning. RRR, and lungs CTAB.
{% endif %}
**DESCRIPTION OF PROCEDURE:**
Timeout performed. {% if preop_albuterol %}Administered 2 puffs Albuterol inhaler prior to beginning procedure. {% endif %}{% if ivga %}IV medication was administered utilizing {{<and_list items={ga_meds}/>}} (see anesthesia report). Patient tolerated this well with good effect. {% endif %}{% if nitrous_used %}100% O2 given via nasal hood at 5L/min for greater than 5 minutes, followed by titration of N2O to 50%. {% endif %}Local anesthesia administered per above. {% set airway = [...throat_screen_text, ...bite_block_text] %}{% if airway %}Throughout the procedure, {{<and_list items={airway}/>}} {% if airway | length > 1 %}were{% else %}was{% endif %} used where appropriate.{% endif %}

{% include "procedure_blocks" %}
{%- if failed_deferred %}
{{ failure_reason_text }}
{% endif %}
Throat screen and bite block removed. Placed gauze pressure dressings. {% if nitrous_used %}N2O turned off, administered 100% O2 for greater than 5 minutes. {% endif %}No complications. Patient was stable throughout{% if not failed_deferred %} and tolerated the procedure very well{% endif %}. At conclusion of procedure, patient was fully awake, alert and stable for discharge. Site was hemostatic at conclusion.

**POST-OPERATIVE INSTRUCTIONS:** Given both verbally and in written statements.

**POST-OPERATIVE MEDICATIONS:**
{% for m in post_op_medications %}{{ m }}
{% endfor %}
**PLAN/FOLLOW UP:**
- follow up prn
"""

# ---------------------------------------------------------------- patient ---
[[fields]]
key = "pt_age"
section = "Patient"
label = "Patient Age"
type = "number"
min = 0
max = 120
required = true

[[fields]]
key = "pt_sex"
section = "Patient"
label = "Sex"
type = "dropdown"
options = ["male", "female", "transgender man", "transgender woman", "patient"]
default = "patient"

[[fields]]
key = "decision_maker"
section = "Patient"
label = "Decision maker"
type = "dropdown"
options = ["patient", "patient's guardian", "patient's DPOA", "patient and patient's guardian"]
default = "patient"

[[fields]]
key = "pmh"
section = "Patient"
label = "PMH (one problem per line)"
type = "textarea"

# -------------------------------------------------------------- diagnosis ---
[[fields]]
key = "diagnosis_teeth"
section = "Diagnosis"
label = "Diagnosis by tooth"
type = "teeth"
linked = "carious_teeth"

[[fields]]
key = "carious_teeth"
section = "Diagnosis"
label = "Carious, hopeless"
type = "teeth"

[[fields]]
key = "diagnoses_free_text"
section = "Diagnosis"
label = "Free text diagnoses"
type = "textarea"

# -------------------------------------------------------------- procedure ---
[[fields]]
key = "ext"
section = "Procedure"
label = "Extraction"
type = "teeth"
linked = "coronectomy"

[[fields]]
key = "coronectomy"
section = "Procedure"
label = "Coronectomy"
type = "teeth"

[[fields]]
key = "plan_changed_to_coronectomy"
section = "Procedure"
label = "Plan changed from ext -> coronectomy"
type = "checkbox"
visible_if = "coronectomy"

[[fields]]
key = "alveoloplasty"
section = "Procedure"
label = "Alveoloplasty"
type = "checkbox"

[[fields]]
key = "alveoloplasty_quadrants"
section = "Procedure"
label = "Alveoloplasty quadrants"
type = "text"
visible_if = "alveoloplasty"

[[fields]]
key = "biopsy"
section = "Procedure"
label = "Biopsy"
type = "checkbox"

[[fields]]
key = "biopsy_site"
section = "Procedure"
label = "Biopsy site"
type = "text"
visible_if = "biopsy"

# ------------------------------------------------------------- anesthesia ---
[[fields]]
key = "nitrous_used"
section = "Anesthesia"
label = "Nitrous (N2O/O2)"
type = "checkbox"
default = true

[[fields]]
key = "ivga"
section = "Anesthesia"
label = "IV general anesthesia"
type = "checkbox"

[[fields]]
key = "ga_time"
section = "Anesthesia"
label = "Total anesthesia time (min)"
type = "number"
default = 30
min = 0
max = 480
visible_if = "ivga"

[[fields]]
key = "asa"
section = "Anesthesia"
label = "ASA"
type = "dropdown"
options = ["1", "2", "3", "4"]
default = "2"
visible_if = "ivga"

[[fields]]
key = "ga_meds"
section = "Anesthesia"
label = "GA medications"
type = "multiselect"
options = ["midazolam", "fentanyl", "ketamine", "propofol"]
visible_if = "ivga"

[[fields]]
key = "local_used"
section = "Anesthesia"
label = "Local anesthetic"
type = "multiselect"
options = ["Lidocaine 2% w/ epi", "Bupivacaine 0.5% w/ epi", "Articaine 4% w/ epi", "Mepivacaine plain", "Topical"]
default = ["Lidocaine 2% w/ epi", "Topical"]

[[fields]]
key = "lidocaine_carps"
section = "Anesthesia"
label = "Lidocaine carpules"
type = "number"
default = 1
min = 1
max = 20
visible_if = "'Lidocaine 2% w/ epi' in local_used"

[[fields]]
key = "bupivacaine_carps"
section = "Anesthesia"
label = "Bupivacaine carpules"
type = "number"
default = 1
min = 1
max = 20
visible_if = "'Bupivacaine 0.5% w/ epi' in local_used"

[[fields]]
key = "articaine_carps"
section = "Anesthesia"
label = "Articaine carpules"
type = "number"
default = 1
min = 1
max = 20
visible_if = "'Articaine 4% w/ epi' in local_used"

[[fields]]
key = "mepivacaine_carps"
section = "Anesthesia"
label = "Mepivacaine carpules"
type = "number"
default = 1
min = 1
max = 20
visible_if = "'Mepivacaine plain' in local_used"

# A read-only tally shown while filling the form (handy against max-dose
# limits). It isn't referenced in `body`, so the note text is unaffected.
[[fields]]
key = "total_local_ml"
section = "Anesthesia"
label = "Total local anesthetic (mL)"
type = "computed"
compute = "((lidocaine_carps if 'Lidocaine 2% w/ epi' in local_used else 0) + (bupivacaine_carps if 'Bupivacaine 0.5% w/ epi' in local_used else 0) + (articaine_carps if 'Articaine 4% w/ epi' in local_used else 0) + (mepivacaine_carps if 'Mepivacaine plain' in local_used else 0)) * 1.7"

# ----------------------------------------------------------------- vitals ---
[[fields]]
key = "bp"
section = "Vitals"
label = "BP"
type = "text"
default = "WNL"
visible_if = "not ivga"

[[fields]]
key = "hr"
section = "Vitals"
label = "HR"
type = "text"
default = "WNL"
visible_if = "not ivga"

# ---------------------------------------------------- history/indications ---
[[fields]]
key = "interval_changes"
section = "History & Indications"
label = "Interval changes"
type = "multiselect"
options = ["history", "exam", "treatment plan"]

[[fields]]
key = "history_changes"
section = "History & Indications"
label = "History changes"
type = "text"
visible_if = "'history' in interval_changes"

[[fields]]
key = "exam_changes"
section = "History & Indications"
label = "Exam changes"
type = "text"
visible_if = "'exam' in interval_changes"

[[fields]]
key = "treatment_plan_changes"
section = "History & Indications"
label = "Treatment plan changes"
type = "text"
visible_if = "'treatment plan' in interval_changes"

[[fields]]
key = "ext_indications"
section = "History & Indications"
label = "Extraction indications"
type = "multiselect"
visible_if = "ext"
default = ["Current symptoms", "Prevent pain/infection"]
options = [
  { label = "Current symptoms", text = "to treat current symptoms" },
  { label = "Prevent pain/infection", text = "to prevent future pain and infection" },
  { label = "Prevent complications impacted teeth", text = "to prevent other complications of impacted teeth including cyst/tumor formation, periodontal disease, and compromise of adjacent structures" },
]

[[fields]]
key = "coronectomy_indications"
section = "History & Indications"
label = "Coronectomy indications"
type = "multiselect"
visible_if = "coronectomy"
default = ["Current symptoms", "Prevent pain/infection", "Prevent complications impacted teeth"]
options = [
  { label = "Current symptoms", text = "to treat current symptoms" },
  { label = "Prevent pain/infection", text = "to prevent future pain and infection" },
  { label = "Prevent complications impacted teeth", text = "to prevent other complications of impacted teeth including cyst/tumor formation, periodontal disease, and compromise of adjacent structures while lowering risk of nerve injury" },
]

[[fields]]
key = "alveoloplasty_indications"
section = "History & Indications"
label = "Alveoloplasty indications"
type = "multiselect"
visible_if = "alveoloplasty"
default = ["Promote healing", "Prepare for denture"]
options = [
  { label = "Current symptoms", text = "to treat current symptoms" },
  { label = "Promote healing", text = "to ensure proper healing" },
  { label = "Prepare for denture", text = "to optimize the ridge contour for future prosthetic rehabilitation" },
  { label = "Existing irregularities", text = "to address existing alveolar irregularities" },
]

# ------------------------------------------------------------ description ---
[[fields]]
key = "throat_screen"
section = "Description of Procedure"
label = "Throat screen"
type = "multiselect"
default = ["Used"]
options = [{ label = "Used", text = "throat screen" }]

[[fields]]
key = "bite_block"
section = "Description of Procedure"
label = "Bite block"
type = "multiselect"
default = ["Used"]
options = [{ label = "Used", text = "bite block for stabilization" }]

[[fields]]
key = "preop_albuterol"
section = "Description of Procedure"
label = "Pre-op albuterol"
type = "checkbox"

[[fields]]
key = "auscultated_heart_lungs"
section = "Description of Procedure"
label = "Auscultated heart and lungs"
type = "checkbox"

[[fields]]
key = "failed_deferred"
section = "Description of Procedure"
label = "Failed / deferred procedure?"
type = "checkbox"

[[fields]]
key = "failure_reason"
section = "Description of Procedure"
label = "Reason for failure"
type = "dropdown"
visible_if = "failed_deferred"
default = "time constraint"
options = [
  { label = "anxiety pre-op", text = "The patient exhibited significant preoperative anxiety, with marked hesitation and visible distress upon entering the operatory. Despite counseling and reassurance, the patient became tearful and physically withdrawn even during initial conversation. They adamantly declined to proceed with treatment under local anesthesia and nitrous oxide, stating they could not tolerate the procedure unless sedated. Due to the severity of the patient's emotional response and the risk of exacerbating psychological trauma, the decision was made to defer treatment for their safety and well-being.\nThe patient has a documented history of procedural intolerance, including a previously aborted extraction attempt due to similar distress. In light of this, IV sedation is medically necessary to ensure safe, humane, and effective delivery of care. Proceeding with extractions under IVGA will help avoid additional complications such as uncontrolled infection, fascial space involvement, osteomyelitis, and prolonged pain." },
  { label = "anxiety intra-op", text = "Despite adequate local anesthesia and administration of nitrous oxide, the patient remained severely anxious throughout the procedure. They required frequent pauses, reassurance, and repositioning, which significantly disrupted the flow of care and prolonged the procedure. The patient exhibited a heightened startle response and reacted unpredictably to routine stimuli such as suctioning and surgical pressure, creating concerns for both patient and provider safety. Due to escalating distress and poor procedural tolerance, the remainder of the planned extractions were deferred. Proceeding under local anesthesia was no longer feasible in a humane or safe manner, and for this reason, this visit should be considered a failed attempt under LA/N2O. Given the patient's intraoperative behavior and inability to tolerate the procedure despite appropriate anesthesia, IVGA is now medically indicated to ensure safe, efficient, and compassionate completion of care." },
  { label = "unable to get numb", text = "Despite the use of multiple advanced local anesthetic techniques - including IAN block, nerve to mylohyoid block, periodontal ligament injection, intraosseous infiltration, and direct intrapulpal anesthesia - adequate analgesia could not be reliably achieved. The patient continued to experience significant discomfort during instrumentation, limiting procedural progress and tolerance.\nThe surgical difficulty was compounded by factors such as dense cortical bone, root morphology, and unfavorable tooth angulation, further increasing the duration and complexity of the procedure. As a result, the experience was both physically and emotionally taxing for the patient and raised concern for procedural safety and completion.\nIn light of this, IV general anesthesia is medically indicated for future procedures of similar complexity as local anesthesia alone has proven insufficient for effective and humane completion of care." },
  { label = "time constraint", text = "At this point, the procedure was prolonged due to the notable surgical difficulty experienced so far given factors such as dense cortical bone, root morphology, and unfavorable tooth angulation. As a result, the experience was both physically and emotionally taxing for the patient and there were additional concerns for the waning effects of local anesthesia should the remaining extractions prove to be of similar difficulty. In light of this, the procedure was ended and the remaining portions of the procedure were deferred to next appointment." },
  { label = "difficult sedation", text = "At this point, the procedure was prolonged due to the notable surgical difficulty experienced so far given factors such as dense cortical bone, root morphology, and unfavorable tooth angulation. The patient was becoming agitated and moving - which was increasingly refractory to additional local anesthesia and boluses of propofol. Decision was made to abort the procedure to maintain safe environment and will plan to complete remaining portions of the procedure at the next appointment." },
]

[[fields]]
key = "post_op_medications"
section = "Description of Procedure"
label = "Post-op medications"
type = "multiselect"
default = ["Acetaminophen 1000mg q6h PRN pain", "Ibuprofen 600mg q6h PRN pain", "Chlorhexidine oral rinse BID x 2 weeks"]
options = [
  "Acetaminophen 1000mg q6h PRN pain",
  "Acetaminophen 1000mg q8h PRN pain",
  "Acetaminophen-codeine 300-30mg (Tylenol #3) 1-2 tabs q4-6h PRN pain",
  "Ibuprofen 600mg q6h PRN pain",
  "Ibuprofen 400mg q6h PRN pain",
  "Oxycodone 5mg q6h PRN pain",
  "Chlorhexidine oral rinse BID x 2 weeks",
  "Ondansetron PRN nausea",
  "Amoxicillin 500mg TID x 5 days",
]

# --------------------------------------------------------- anesthesia time ---
[[speed_buttons]]
label = "GA 30min"
visible_if = "ivga"
values = { ga_time = 30 }

[[speed_buttons]]
label = "45"
visible_if = "ivga"
values = { ga_time = 45 }

[[speed_buttons]]
label = "60"
visible_if = "ivga"
values = { ga_time = 60 }

[[speed_buttons]]
label = "90"
visible_if = "ivga"
values = { ga_time = 90 }

[[speed_buttons]]
label = "120"
visible_if = "ivga"
values = { ga_time = 120 }

# --- Per-tooth diagnosis: driven by the `diagnosis_teeth` multiselect, so
# --- picking teeth up top creates exactly one diagnosis row per tooth.
[[groups]]
key = "tooth_diagnoses"
label = "Diagnosis"
source = "diagnosis_teeth"
source_as = "tooth"

[[groups.fields]]
key = "diagnosis"
label = "Diagnosis"
type = "multiselect"
required = true
options = ["symptomatic", "carious", "periodontally compromised", "PBI", "CBI", "soft tissue impacted", "malposed"]

