# NOTE: clinic_note_tmj_consult
# Assembled from the TMJ consult snippets; common_tmj_case holds the facts
# they share (age, side of complaint, referring provider).
name = "Clinic - TMJ Consult"
use_partials = ["common_tmj_case", "clinic_hpi_tmj", "clinic_history_tmj", "clinic_exam_tmj", "clinic_imaging_tmj", "clinic_assessment_plan_tmj"]
# Imaging is read at the desk, so the printed sheet leaves it off.
print_skip = ["Imaging - TMJ consult"]

body = """
{% include "common_tmj_case" %}{% include "clinic_hpi_tmj" %}
{% include "clinic_history_tmj" %}
**EXAMINATION:**
{% include "clinic_exam_tmj" %}
**IMAGING:**
{% include "clinic_imaging_tmj" %}
{% include "clinic_assessment_plan_tmj" %}
"""

# ---------------------------------------------------------- pathway presets ---
# Top row of the form. Each sets the diagnoses and the plan pathway, replacing
# whatever an earlier preset picked. The side of each diagnosis is left for
# the surgeon to pick.

