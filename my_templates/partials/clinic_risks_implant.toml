# SNIPPET: clinic_risks_implant   PREFIX: imp_risk
# Revised by hand. General surgical risks, then the risks specific to the next
# procedure: those of each component picked under "Next procedure" in the
# plan, of the charted sites (nerve, sinus, esthetic zone), and of the risk
# factors in the history. Anything missing can be added by checkbox.
name = "Snippet: Risks - dental implants"
use_partials = ["common_implant_case"]

body = """
{%- set np = imp_ap_next_procedure if imp_ap_next_procedure is defined else [] -%}
{%- set extraction = "Extraction" in np or "Immediate implant" in np -%}
{%- set implant = "Implant placement" in np or "Immediate implant" in np or "Crestal sinus lift" in np -%}
{%- set sinus_lift = "Crestal sinus lift" in np or "Lateral sinus lift" in np -%}
{%- set surgery = extraction or implant or sinus_lift or "GBR" in np or "Socket preservation" in np -%}
{%- set manual = imp_risk_manual -%}
{%- set specific = [
  "fracture of the alveolar bone or retained root fragments" if extraction else "",
  "partial graft resorption or loss requiring regrafting" if "Socket preservation" in np else "",
  "failure of osseointegration requiring implant removal and replacement" if implant else "",
  "inadequate primary stability requiring grafting and delayed placement" if "Immediate implant" in np else "",
  "soft tissue recession" if "Immediate implant" in np and not imp_esthetic and "Esthetic zone" not in manual else "",
  "provisional loosening or fracture and implant failure from premature loading" if "Immediate provisional" in np else "",
  "membrane exposure, wound dehiscence, or incomplete regeneration" if "GBR" in np else "",
  "sinus membrane perforation and postoperative sinusitis" if sinus_lift else "",
  "graft infection and oroantral communication" if "Lateral sinus lift" in np else "",
  "injury to adjacent teeth" if surgery else "",
  "temporary or permanent altered sensation of the lip, chin, tongue, or gingiva from inferior alveolar, mental, or lingual nerve injury" if (imp_mand_posterior and surgery) or "IAN / lingual nerve" in manual else "",
  "sinus perforation or oroantral communication" if (imp_max_posterior and surgery and not sinus_lift) or "Maxillary sinus" in manual else "",
  "soft tissue recession and esthetic compromise" if (imp_esthetic and surgery) or "Esthetic zone" in manual else "",
  "sedation-related respiratory depression and airway compromise" if (imp_ap_anesthesia_plan is defined and imp_ap_anesthesia_plan == "IV sedation") or "IV sedation" in manual else "",
  "higher failure and complication rates with tobacco use" if (imp_hx_tobacco_use is defined and imp_hx_tobacco_use in ["Current", "Vaping"]) or "Tobacco" in manual else "",
  "higher infection and failure rates with suboptimal glycemic control" if (imp_hx_diabetes_status is defined and imp_hx_diabetes_status == "Yes") or "Diabetes" in manual else "",
  "medication-related osteonecrosis of the jaw" if (imp_hx_antiresorptive_history is defined and imp_hx_antiresorptive_history not in ["No", ""]) or "Antiresorptive / MRONJ" in manual else "",
  "osteoradionecrosis" if (imp_hx_head_neck_radiation is defined and imp_hx_head_neck_radiation == "Yes") or "Head & neck radiation" in manual else "",
  "implant overload from parafunction" if (imp_hx_bruxism_history is defined and imp_hx_bruxism_history == "Reports") or (imp_exam_parafunction_signs is defined and imp_exam_parafunction_signs == "Present") or "Bruxism" in manual else "",
  "***" if "***" in manual else "",
] -%}
{%- set specific = [p for p in specific if p] | unique -%}
Risks, benefits, and alternatives were discussed. Risks reviewed:
- General surgical: bleeding, infection, pain, swelling, bruising, delayed healing, and the possible need for additional procedures.{% if specific %}
- Specific to the planned procedure: {% if specific | length > 1 %}{{ specific[:-1] | join(sep="; ") }}; and {{ specific[-1] }}{% else %}{{ specific | first }}{% endif %}.{% endif %}
The patient understands that success cannot be guaranteed. All questions were answered, and the patient verbalized understanding."""

[[fields]]
key = "imp_risk_manual"
label = "Add specific risks (procedure, site, history and sedation risks are added automatically)"
section = "Risks"
type = "multiselect"
options = [
  "IAN / lingual nerve",
  "Maxillary sinus",
  "Esthetic zone",
  "IV sedation",
  "Tobacco",
  "Diabetes",
  "Antiresorptive / MRONJ",
  "Head & neck radiation",
  "Bruxism",
  "***",
]
