default = "Local"
options = [
  { label = "Local", text = "local anesthesia" },
  { label = "IV sedation", text = "IV sedation; NPO and escort instructions reviewed" },
  { label = "General anesthesia", text = "general anesthesia; NPO and escort instructions reviewed" },
