type = "multiselect"
options = [
  { label = "Periapical cyst", text = "periapical (radicular) cyst" },
  { label = "Periapical granuloma", text = "periapical granuloma" },
  { label = "Dentigerous cyst", text = "dentigerous cyst" },
  { label = "OKC", text = "odontogenic keratocyst" },
  { label = "Ameloblastoma", text = "ameloblastoma" },
  { label = "COD", text = "cemento-osseous dysplasia" },
  { label = "Fibro-osseous", text = "fibro-osseous lesion" },
  { label = "CGCG", text = "central giant cell granuloma" },
  { label = "Simple bone cyst", text = "simple bone cyst" },
  { label = "Odontoma", text = "odontoma" },
  { label = "Osteomyelitis", text = "osteomyelitis" },
  { label = "Malignancy", text = "malignancy, primary or metastatic" },
