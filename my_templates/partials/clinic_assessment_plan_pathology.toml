[[fields]]
key = "path_ap_alternatives"
label = "Alternatives"
section = "Assessment & plan - pathology consult"
type = "multiselect"
default = ["Serial exams", "No treatment"]
options = [
  { label = "Serial exams", text = "observation with serial examination" },
  { label = "Serial imaging", text = "observation with serial imaging" },
  { label = "Immediate biopsy", text = "immediate biopsy" },
  { label = "Brush cytology", text = "brush cytology" },
  { label = "Incisional bx", text = "incisional biopsy" },
  { label = "Excisional bx", text = "excisional biopsy" },
  { label = "Surgery without bx", text = "definitive surgery without prior biopsy" },
  { label = "No treatment", text = "no treatment" },
  { label = "***", text = "***" },
]

[[fields]]
key = "path_ap_patient_decision"
label = "Patient decision"
section = "Assessment & plan - pathology consult"
type = "dropdown"
default = "Proceed"
options = [
  { label = "Proceed", text = "elected to proceed with the plan outlined below." },
  { label = "Considering", text = "will consider the options discussed and contact our office." },
  { label = "Declines", text = "declines biopsy at this time; the risk of a delayed diagnosis of a potentially serious condition was reviewed." },
  { label = "***", text = "***" },
]

