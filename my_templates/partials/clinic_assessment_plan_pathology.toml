  { label = "Traumatic ulcer", text = "traumatic ulcer" },
  { label = "Frictional keratosis", text = "frictional keratosis" },
  { label = "Leukoplakia", text = "leukoplakia" },
  { label = "Erythroplakia", text = "erythroplakia" },
  { label = "Lichen planus", text = "oral lichen planus" },
  { label = "Candidiasis", text = "candidiasis" },
  { label = "Salivary neoplasm", text = "minor salivary gland neoplasm" },
  { label = "SCC", text = "squamous cell carcinoma" },
  { label = "***", text = "***" },
