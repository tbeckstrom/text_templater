  { label = "Mucocele", text = "mucocele" },
  { label = "Pyogenic granuloma", text = "pyogenic granuloma" },
  { label = "PGCG", text = "peripheral giant cell granuloma" },
  { label = "POF", text = "peripheral ossifying fibroma" },
