[[fields]]
key = "exo_proc_abort_reason"
label = "Reason"
section = "Procedure - extraction"
type = "dropdown"
required = true
visible_if = "exo_proc_aborted"
options = [
  { label = "Anxiety pre-op", text = "The patient exhibited significant preoperative anxiety, with marked hesitation and visible distress upon entering the operatory. Despite counseling and reassurance, the patient became tearful and physically withdrawn even during initial conversation. They adamantly declined to proceed with treatment under local anesthesia and nitrous oxide, stating they could not tolerate the procedure unless sedated. Due to the severity of the patient's emotional response and the risk of exacerbating psychological trauma, the decision was made to defer treatment for their safety and well-being. The patient has a documented history of procedural intolerance, including a previously aborted extraction attempt due to similar distress. In light of this, IV sedation is medically necessary to ensure safe, humane, and effective delivery of care. Proceeding with extractions under IVGA will help avoid additional complications such as uncontrolled infection, fascial space involvement, osteomyelitis, and prolonged pain." },
  { label = "Anxiety intra-op", text = "Despite adequate local anesthesia and administration of nitrous oxide, the patient remained severely anxious throughout the procedure. They required frequent pauses, reassurance, and repositioning, which significantly disrupted the flow of care and prolonged the procedure. The patient exhibited a heightened startle response and reacted unpredictably to routine stimuli such as suctioning and surgical pressure, creating concerns for both patient and provider safety. Due to escalating distress and poor procedural tolerance, the remainder of the planned extractions were deferred. Proceeding under local anesthesia was no longer feasible in a humane or safe manner, and for this reason, this visit should be considered a failed attempt under LA/N2O. Given the patient's intraoperative behavior and inability to tolerate the procedure despite appropriate anesthesia, IVGA is now medically indicated to ensure safe, efficient, and compassionate completion of care." },
  { label = "Unable to get numb", text = "Despite the use of multiple advanced local anesthetic techniques - including IAN block, nerve to mylohyoid block, periodontal ligament injection, intraosseous infiltration, and direct intrapulpal anesthesia - adequate analgesia could not be reliably achieved. The patient continued to experience significant discomfort during instrumentation, limiting procedural progress and tolerance. The surgical difficulty was compounded by factors such as dense cortical bone, root morphology, and unfavorable tooth angulation, further increasing the duration and complexity of the procedure. As a result, the experience was both physically and emotionally taxing for the patient and raised concern for procedural safety and completion. In light of this, IV general anesthesia is medically indicated for future procedures of similar complexity as local anesthesia alone has proven insufficient for effective and humane completion of care." },
  { label = "Time constraint", text = "At this point, the procedure was prolonged due to the notable surgical difficulty experienced so far given factors such as dense cortical bone, root morphology, and unfavorable tooth angulation. As a result, the experience was both physically and emotionally taxing for the patient and there were additional concerns for the waning effects of local anesthesia should the remaining extractions prove to be of similar difficulty. In light of this, the procedure was ended and the remaining portions of the procedure were deferred to the next appointment." },
  { label = "Difficult sedation", text = "At this point, the procedure was prolonged due to the notable surgical difficulty experienced so far given factors such as dense cortical bone, root morphology, and unfavorable tooth angulation. The patient was becoming agitated and moving, which was increasingly refractory to additional local anesthesia and boluses of propofol. The decision was made to abort the procedure to maintain a safe environment, and the remaining portions of the procedure will be completed at the next appointment." },
  { label = "***", text = "***" },
]

