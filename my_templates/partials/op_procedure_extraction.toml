# SNIPPET: op_procedure_extraction   PREFIX: exo_proc
# Description of procedure for an extraction visit. Simple teeth share one
# paragraph; each surgical tooth gets its own box (flap, bone removal and
# sectioning, delivery, socket, closure). Maxillary posterior and mandibular
# posterior surgical teeth bring in the OAC and IAN lines. Socket
# preservation, alveoloplasty (by sextant), I&D, biopsy and an aborted /
# deferred paragraph are optional adds.
name = "Snippet: Procedure - extraction"
use_partials = ["common_exo_case"]

body = """
{%- set simple_steps = exo_proc_simple_steps_text | join(sep=" ") | replace(from="[[exo_proc_simple_suture_material]]", to=exo_proc_simple_suture_material) | replace(from="[[exo_proc_simple_suture_pattern]]", to=exo_proc_simple_suture_pattern) -%}
**DESCRIPTION OF PROCEDURE:**
Timeout performed.{% if exo_proc_albuterol %} Two puffs of albuterol inhaler were administered prior to beginning the procedure.{% endif %}{% if exo_iv_sedation %} IV sedation was administered (see anesthesia record); the patient tolerated this well with good effect.{% endif %}{% if exo_nitrous %} 100% O2 was given via nasal hood at 5 L/min for greater than 5 minutes, followed by titration of N2O to 50%.{% endif %} Local anesthesia was administered as above.{% if exo_proc_airway_items_text %} {{ exo_proc_airway_items_text | join(sep=" ") }}{% endif %}
{% set middle %}{% if exo_simple_teeth and exo_proc_simple_steps %}Simple extraction, {{ exo_simple_teeth_tooth_word }} {{ exo_simple_teeth_list }}: {{ simple_steps }}
{% endif %}
{%- for b in exo_proc_surgical_boxes %}
{%- set parts = [
  "Initial elevation after severing the PDL with a #9 periosteal elevator gave inadequate mobility for delivery, so a surgical approach was taken." if b.converted else "",
  (b.flap_type_text | replace(from="[[flap_from_tooth]]", to=b.flap_from_tooth) | replace(from="[[flap_to_tooth]]", to=b.flap_to_tooth)) if b.flap_type else "",
  (b.bone_sectioning_text | join(sep=" ") | replace(from="[[root]]", to=b.root)) if b.bone_sectioning else "",
  b.delivery_text if b.delivery else "",
  (b.socket_steps_text | join(sep=" ")) if b.socket_steps else "",
  ("The flap was reapproximated with " ~ b.suture_material ~ " suture in " ~ b.suture_pattern ~ " fashion.") if b.suture_material and b.suture_pattern else "",
] -%}
{%- set parts = [p for p in parts if p] -%}
{% if parts %}Surgical extraction, tooth {{ b.site }}: {{ parts | join(sep=" ") }}
{% endif %}{% endfor %}
{%- if exo_max_posterior or exo_proc_no_oac %}No oroantral communication was noted.
{% endif %}
{%- if exo_surgical_mand_posterior or exo_proc_ian_not_encountered %}The inferior alveolar canal was not encountered and the lingual plate was intact.
{% endif %}
{%- if exo_proc_socket_preservation and exo_proc_socket_sites and exo_proc_graft_material == "Bone plug (OsteoGen)" and exo_proc_cover_fixation %}Socket preservation, {{ exo_proc_socket_sites_site_word }} {{ exo_proc_socket_sites_list }}: {{ exo_proc_graft_material_text }} was placed into the socket, secured with {{ exo_proc_cover_fixation }}.
{% elif exo_proc_socket_preservation and exo_proc_socket_sites and exo_proc_graft_material and exo_proc_graft_cover and exo_proc_cover_fixation %}Socket preservation, {{ exo_proc_socket_sites_site_word }} {{ exo_proc_socket_sites_list }}: {{ exo_proc_graft_material_text }} was placed and covered with {{ exo_proc_graft_cover }}, secured with {{ exo_proc_cover_fixation }}.
{% endif %}
{%- if exo_proc_socket_preservation and exo_proc_graft_product_and_lot %}Graft: {{ exo_proc_graft_product_and_lot }}
{% endif %}
{%- if exo_proc_alveoloplasty and exo_proc_alveo_sextants and exo_proc_alveo_instruments and exo_proc_alveo_suture_material and exo_proc_alveo_suture_pattern %}Alveoloplasty, {% for v in exo_proc_alveo_sextants_text %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %}: a crestal incision was made and a full thickness mucoperiosteal flap was raised to expose the ridge. The ridge was recontoured with {% for v in exo_proc_alveo_instruments %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %} until the contour was appropriate and no sharp edges or excessive undercuts remained. The site was irrigated with copious sterile saline and the flap was closed with {{ exo_proc_alveo_suture_material }} suture in {{ exo_proc_alveo_suture_pattern }} fashion.
{% endif %}
{%- if exo_proc_incision_drainage %}
{%- set id = [
  "Incision and drainage, " ~ exo_proc_id_site ~ ": an incision was made through mucosa and periosteum and blunt dissection was carried into the abscess cavity.",
  exo_proc_purulence_text if exo_proc_purulence else "",
  "A specimen was obtained for culture and sensitivity." if exo_proc_culture_sent else "",
  "The cavity was irrigated with copious sterile saline.",
  exo_proc_id_drain_text if exo_proc_id_drain else "",
] -%}
{{ [s for s in id if s] | join(sep=" ") }}
{% endif %}
{%- if exo_proc_biopsy %}{{ exo_proc_biopsy_tissue_text }} was excised from {{ exo_proc_biopsy_site }} and submitted in formalin for histopathologic examination.
{% endif %}
{%- if exo_proc_aborted %}{{ exo_proc_abort_reason_text }}
{% if exo_proc_deferred_teeth %}Treatment of {{ exo_proc_deferred_teeth_tooth_word }} {{ exo_proc_deferred_teeth_list }} was deferred to the next appointment.
{% endif %}{% endif %}{% endset %}
{%- if middle %}
{{ middle }}{% endif %}
Gauze pressure dressings were placed.{% if "Throat screen" in exo_proc_airway_items %} The throat screen was removed and the oropharynx was inspected.{% endif %}{% if exo_nitrous %} N2O was turned off and 100% O2 was administered for greater than 5 minutes.{% endif %} No complications. The patient remained stable throughout.{% if exo_proc_tolerated %} The patient tolerated the procedure well.{% endif %} At the conclusion of the procedure, the patient was fully awake, alert and stable for discharge, and the surgical sites were hemostatic.{% if exo_iv_sedation %} The patient was discharged in the care of a responsible adult escort.{% endif %}
"""

