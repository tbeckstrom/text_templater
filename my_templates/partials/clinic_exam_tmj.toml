values = { tmj_exam_r_joint_sounds = "No sounds", tmj_exam_r_joint_palpation = "Non-tender", tmj_exam_r_joint_loading = "No pain on loading", tmj_exam_l_joint_sounds = "No sounds", tmj_exam_l_joint_palpation = "Non-tender", tmj_exam_l_joint_loading = "No pain on loading" }

[[speed_buttons]]
label = "Pain-free motion, muscles non-tender"
section = "Exam - TMJ consult"
values = { tmj_exam_opening_pain = "without pain", tmj_exam_opening_path = "Straight", tmj_exam_excursion_pain = "without pain", tmj_exam_muscle_status = "Non-tender" }
