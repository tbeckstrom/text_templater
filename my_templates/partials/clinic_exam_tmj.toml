# SNIPPET: clinic_exam_tmj   PREFIX: tmj_exam
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# Every line is left out of the note until something is picked; "***" is a
# deliberate choice, never the fallback. Each joint has its own bullet so
# asymmetric findings chart cleanly.
name = "Snippet: Exam - TMJ consult"

body = """
{%- set opening = [
  ("maximal interincisal opening " ~ tmj_exam_mio_mm ~ " mm") if tmj_exam_mio_mm else "",
  ("assisted " ~ tmj_exam_assisted_opening_mm ~ " mm") if tmj_exam_assisted_opening_mm else "",
  tmj_exam_opening_pain if tmj_exam_opening_pain else "",
  tmj_exam_opening_path_text if tmj_exam_opening_path else "",
] -%}
{%- set opening = [p for p in opening if p] -%}
{%- set excursions = [
  ("right lateral " ~ tmj_exam_right_lateral_mm ~ " mm") if tmj_exam_right_lateral_mm else "",
  ("left lateral " ~ tmj_exam_left_lateral_mm ~ " mm") if tmj_exam_left_lateral_mm else "",
  ("protrusive " ~ tmj_exam_protrusive_mm ~ " mm") if tmj_exam_protrusive_mm else "",
  tmj_exam_excursion_pain if tmj_exam_excursion_pain else "",
] -%}
{%- set excursions = [p for p in excursions if p] -%}
{%- set rtmj = [
  tmj_exam_r_joint_sounds_text if tmj_exam_r_joint_sounds else "",
  tmj_exam_r_joint_palpation_text if tmj_exam_r_joint_palpation else "",
  tmj_exam_r_joint_loading_text if tmj_exam_r_joint_loading else "",
] -%}
{%- set rtmj = [p for p in rtmj if p] -%}
{%- set ltmj = [
  tmj_exam_l_joint_sounds_text if tmj_exam_l_joint_sounds else "",
  tmj_exam_l_joint_palpation_text if tmj_exam_l_joint_palpation else "",
  tmj_exam_l_joint_loading_text if tmj_exam_l_joint_loading else "",
] -%}
{%- set ltmj = [p for p in ltmj if p] -%}
{%- set tender_muscles_joined %}{% for v in tmj_exam_tender_muscles_text %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %}{% endset -%}
{%- set muscles = [
  tmj_exam_muscle_status_text | replace(from="[[tmj_exam_tender_muscles]]", to=tender_muscles_joined) if tmj_exam_muscle_status else "",
  "reproducing the patient's familiar pain" if tmj_exam_familiar_pain else "",
  tmj_exam_muscle_other if tmj_exam_muscle_other else "",
] -%}
{%- set muscles = [p for p in muscles if p] -%}
{%- set lines = [
  ("Face: " ~ tmj_exam_face_findings) if tmj_exam_face_findings else "",
  ("Mouth opening: " ~ opening | join(sep=", ")) if opening else "",
  ("Excursions: " ~ excursions | join(sep=", ")) if excursions else "",
  ("Right TMJ: " ~ (rtmj[:-1] | join(sep="; ") ~ "; and " ~ rtmj[-1] if rtmj | length > 1 else rtmj | first) ~ (", " ~ tmj_exam_r_joint_other if tmj_exam_r_joint_other else "")) if rtmj else (("Right TMJ: " ~ tmj_exam_r_joint_other) if tmj_exam_r_joint_other else ""),
  ("Left TMJ: " ~ (ltmj[:-1] | join(sep="; ") ~ "; and " ~ ltmj[-1] if ltmj | length > 1 else ltmj | first) ~ (", " ~ tmj_exam_l_joint_other if tmj_exam_l_joint_other else "")) if ltmj else (("Left TMJ: " ~ tmj_exam_l_joint_other) if tmj_exam_l_joint_other else ""),
  ("Muscles of mastication: " ~ muscles | join(sep=", ")) if muscles else "",
  ("Occlusion: " ~ tmj_exam_occlusion_status_text | replace(from="[[tmj_exam_side]]", to=tmj_exam_side) | replace(from="[[tmj_exam_side_2]]", to=tmj_exam_side_2)) if tmj_exam_occlusion_status else "",
  ("Signs of parafunction: " ~ ((tmj_exam_parafunction_signs[:-1] | join(sep=", ")) ~ " and " ~ tmj_exam_parafunction_signs[-1] if tmj_exam_parafunction_signs | length > 1 else tmj_exam_parafunction_signs | first)) if tmj_exam_parafunction_signs else "",
  ("Cranial nerves: " ~ tmj_exam_cranial_nerves_text) if tmj_exam_cranial_nerves else "",
] -%}
{%- for l in lines %}{% if l %}- {{ l }}
{% endif %}{% endfor %}"""

[[fields]]
key = "tmj_exam_face_findings"
label = "Face"
section = "Exam - TMJ consult"
type = "dropdown"
default = "symmetric"
options = ["symmetric", "bilateral masseteric hypertrophy", "asymmetric", "***"]

