  { label = "Stable", text = "stable and reproducible" },
  { label = "Posterior open bite", text = "posterior open bite, [[tmj_exam_side]]" },
  { label = "Anterior open bite", text = "anterior open bite" },
  { label = "Midline shift", text = "mandibular midline shift to the [[tmj_exam_side_2]]" },
  { label = "***", text = "***" },
]

