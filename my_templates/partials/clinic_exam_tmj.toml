options = ["without pain", "with pain", "***"]

[[fields]]
key = "tmj_exam_opening_path"
label = "Opening path"
section = "Exam - TMJ consult"
type = "dropdown"
options = [
  { label = "Straight", text = "straight opening path" },
  { label = "Deviation R", text = "deviation to the right with return to midline" },
  { label = "Deviation L", text = "deviation to the left with return to midline" },
  { label = "Deflection R", text = "deflection to the right without correction" },
  { label = "Deflection L", text = "deflection to the left without correction" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tmj_exam_right_lateral_mm"
