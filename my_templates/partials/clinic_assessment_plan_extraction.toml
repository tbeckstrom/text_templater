# SNIPPET: clinic_assessment_plan_extraction   PREFIX: ext_ap
# Generated from the snippet language - see .claude/skills/snippet-to-toml,
# with the problem statement written by hand: it describes each tooth by the
# conditions picked in the exam (grossly carious, fractured, periodontally
# involved, mobile; retained root), grouping teeth with the same set
# (groups joined with semicolons), and
# falls back to "nonrestorable". Signs (tenderness, swelling, sinus tract)
# stay in the exam. "Next procedure" drives the adjunct rationale, its plan
# bullet and the specific risks; the anesthesia ends that line. Risk factors
# from the history add their plan bullets automatically (each can also be
# ticked by hand). Plan lines are left out until picked ("***" is a
# deliberate choice). The pathway presets that fill this section live in the
# note.
name = "Snippet: Assessment & plan - extraction consult"
use_partials = ["common_extraction_case", "clinic_risks_extraction"]

body = """
{%- set np = ext_ap_next_procedure -%}
{%- set alts = ext_ap_alternatives_text -%}
{%- set teeth = ext_teeth_tooth_word ~ " " ~ ext_teeth_list -%}
{%- set sedated = ext_ap_anesthesia_plan in ["IV sedation", "General anesthesia"] -%}
{%- set cannabis = soc_cannabis is defined and soc_cannabis -%}
{%- set adj = ["grossly carious", "fractured", "periodontally involved", "mobile"] -%}
{%- if ext_exam_teeth is defined -%}
{%- set tp_items = [("retained root" if "retained root" in b.conditions else (([a for a in adj if a in b.conditions] | join(sep=", ")) if [a for a in adj if a in b.conditions] else "nonrestorable")) ~ "|" ~ b.tooth for b in ext_exam_teeth] -%}
{%- else -%}
{%- set tp_items = ["nonrestorable|" ~ t for t in ext_extract_teeth] -%}
{%- endif -%}
{%- set tp_descs = [i | split(pat="|") | first for i in tp_items] | unique -%}
{%- set adjunct = [
  "A surgical approach with sectioning and bone removal as needed is anticipated." if "surgical extraction" in np else "",
  "Alveoloplasty will smooth the ridge for prosthesis fabrication." if "alveoloplasty" in np else "",
  "Socket preservation will limit ridge resorption ahead of implant placement." if "socket preservation" in np else "",
  "Incision and drainage will decompress the associated abscess." if "incision and drainage" in np else "",
  "Periapical tissue will be submitted for histopathologic diagnosis." if "periapical biopsy" in np else "",
] -%}
{%- set rec = [
  "Extraction of " ~ teeth ~ " is recommended.",
  ext_ap_indication_rationale_text | join(sep=" ") | replace(from="[[ext_ap_clearance_reason]]", to=ext_ap_clearance_reason) if ext_ap_indication_rationale else "",
  [a for a in adjunct if a] | join(sep=" "),
  ("Cannabis use was noted; " ~ ext_dm_phrase ~ " was counseled that regular cannabis use may reduce the effectiveness of sedation and increase anesthetic requirements, and abstinence for at least 2 weeks before surgery was recommended.") if cannabis and sedated else "",
] -%}
{%- set rec = [r for r in rec if r] -%}
{%- set lines = [
  ("Next procedure: " ~ ((np[:-1] | join(sep=", ")) ~ " and " ~ np[-1] if np | length > 1 else np | first) ~ ", " ~ teeth ~ (" under " ~ ext_ap_anesthesia_plan_text if ext_ap_anesthesia_plan else "") ~ ".") if np else "",
  ("Antibiotics: " ~ ext_ap_antibiotics_text ~ ".") if ext_ap_antibiotics else "",
  ("Analgesia: " ~ ext_ap_analgesia_text | replace(from="[[ext_ap_opioid_dose_and_quantity]]", to=ext_ap_opioid_dose_and_quantity) ~ ".") if ext_ap_analgesia else "",
  "Chlorhexidine 0.12% rinse BID beginning the day after surgery for 1 week." if ext_ap_chlorhexidine_bullet else "",
  "Tobacco cessation counseling provided; advised to avoid smoking for at least 72 hours after surgery." if ext_ap_tobacco_bullet or (ext_hx_tobacco_use is defined and ext_hx_tobacco_use in ["current", "vaping"]) else "",
  "Advised to abstain from cannabis for at least 2 weeks before sedation." if ext_ap_cannabis_bullet or (cannabis and sedated) else "",
  "Increased dry socket risk with oral contraceptive use reviewed." if ext_ap_ocp_bullet or (ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and "Oral contraceptives" in ext_hx_other_risks) else "",
  "Perioperative anticoagulant/antiplatelet management to be coordinated with the prescribing provider; local hemostatic measures planned." if ext_ap_anticoag_bullet or (ext_hx_anticoag_use is defined and ext_hx_anticoag_use == "Yes") else "",
  "Hemostatic management to be coordinated with hematology prior to surgery." if ext_ap_bleeding_bullet or (ext_hx_bleeding_disorder is defined and ext_hx_bleeding_disorder == "Yes") else "",
  "Recent A1c and PCP clearance requested prior to surgery." if ext_ap_diabetes_bullet or (ext_hx_diabetes_status is defined and ext_hx_diabetes_status == "Yes") else "",
  "MRONJ precautions: atraumatic technique with primary closure where feasible, and close follow-up until mucosal healing." if ext_ap_antiresorptive_bullet or (ext_hx_antiresorptive is defined and ext_hx_antiresorptive in ["Oral bisphosphonate", "IV BP / denosumab"]) else "",
  "Radiation oncology records requested to confirm dose to the extraction sites; ORN precautions with atraumatic technique, primary closure, and close follow-up." if ext_ap_radiation_bullet or (ext_hx_hn_radiation is defined and ext_hx_hn_radiation == "Yes") else "",
  "Antibiotic prophylaxis per current AHA or orthopedic guidance." if ext_ap_prophylaxis_bullet or (ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and ("Cardiac prophylaxis" in ext_hx_other_risks or "Prosthetic joint" in ext_hx_other_risks)) else "",
  "Timing coordinated with the treating team to allow at least 2-3 weeks of mucosal healing before therapy begins." if ext_ap_clearance_timing else "",
  ("Tooth replacement: " ~ ext_ap_replacement_plan_text ~ ".") if ext_ap_replacement_plan else "",
  ("Written informed consent to be reviewed and signed by " ~ ext_dm_phrase ~ " at the surgical visit.") if ext_ap_consent_bullet else "",
  ("Follow-up: " ~ ext_ap_follow_up_text ~ ".") if ext_ap_follow_up else "",
  ext_ap_next_step_text if ext_ap_next_step else "",
] -%}
**ASSESSMENT:**
{{ ext_pt_intro }} presenting with {% for d in tp_descs %}{% set ts = [i | split(pat="|") | last for i in tp_items if i | split(pat="|") | first == d] %}{% set ts_list = (ts[:-1] | join(sep=", ")) ~ " and " ~ ts[-1] if ts | length > 1 else ts | first %}{% if not loop.first %}{% if loop.last %}; and {% else %}; {% endif %}{% endif %}{% if d == "retained root" %}{{ "retained roots of teeth" if ts | length > 1 else "retained root of tooth" }} {{ ts_list }}{% else %}{{ d }} {{ "teeth" if ts | length > 1 else "tooth" }} {{ ts_list }}{% endif %}{% endfor %}{% if not tp_descs %}***{% endif %}{% if ext_ap_problems %} with {% for v in ext_ap_problems_text %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %}{% endif %}.

{{ rec | join(sep=" ") }}{% if alts %}

Alternatives reviewed: {% if alts | length > 1 %}{{ alts[:-1] | join(sep="; ") }}; and {{ alts[-1] }}{% else %}{{ alts | first }}{% endif %}.{% endif %}{% if ext_ap_replacement_plan or ext_ap_clearance_timing %}
Treatment timing and sequencing were discussed as outlined in the plan below.{% endif %}
{% include "clinic_risks_extraction" %}

After shared decision making, {{ ext_dm_phrase }} {{ ext_ap_patient_decision_text if ext_ap_patient_decision else "***" }}

**PLAN:**
{%- for l in lines %}{% if l %}
- {{ l }}{% endif %}{% endfor %}"""

# ------------------------------------------------------------- assessment ---

[[fields]]
key = "ext_ap_problems"
label = "Problems (added after the tooth conditions)"
section = "Assessment & plan - extraction consult"
type = "multiselect"
options = [
  { label = "Periapical infection", text = "periapical infection" },
  { label = "Failed endo", text = "failed endodontic therapy" },
  { label = "Poor prognosis", text = "a poor long-term prognosis" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_indication_rationale"
label = "Indication rationale"
section = "Assessment & plan - extraction consult"
type = "multiselect"
options = [
  { label = "Nonrestorable", text = "Predictable restoration is not possible given the extent of structural loss." },
  { label = "Perio hopeless", text = "Advanced attachment loss and mobility give a hopeless periodontal prognosis." },
  { label = "Infection", text = "Extraction will eliminate the source of infection and reduce the risk of spread to the deep fascial spaces." },
  { label = "Failed endo", text = "Endodontic retreatment or apical surgery is not expected to be predictable." },
  { label = "Preprosthetic", text = "Extraction allows fabrication of a stable prosthesis, as the remaining dentition cannot reliably support or be incorporated into one." },
  { label = "Medical clearance", text = "Extraction before [[ext_ap_clearance_reason]] eliminates potential sources of infection while surgical risk is lowest." },
  { label = "***", text = "***" },
]
default = ["Nonrestorable"]

[[fields]]
key = "ext_ap_clearance_reason"
label = "Clearance reason"
section = "Assessment & plan - extraction consult"
type = "dropdown"
required = true
options = [
  "head and neck radiation",
  "antiresorptive therapy",
  "organ transplant",
  "cardiac valve surgery",
  "chemotherapy",
  "***",
]
visible_if = "'Medical clearance' in ext_ap_indication_rationale"

[[fields]]
key = "ext_ap_alternatives"
label = "Alternatives reviewed"
section = "Assessment & plan - extraction consult"
type = "multiselect"
options = [
  { label = "No treatment", text = "no treatment (risk of pain, spreading infection, and bone loss)" },
  { label = "Restorative/endo", text = "restorative or endodontic treatment (poor prognosis)" },
  { label = "Periodontal therapy", text = "periodontal therapy (poor prognosis)" },
  { label = "***", text = "***" },
]
default = ["No treatment", "Restorative/endo"]

[[fields]]
key = "ext_ap_patient_decision"
label = "Patient decision"
section = "Assessment & plan - extraction consult"
type = "dropdown"
default = "Proceed"
options = [
  { label = "Proceed", text = "wishes to proceed with the recommended treatment." },
  { label = "Considering", text = "wishes to consider the options discussed and will contact the office when ready." },
  { label = "Declines", text = "declines extraction at this time; the consequences of no treatment were reviewed." },
  { label = "***", text = "***" },
]

# ------------------------------------------------------------------- plan ---

[[fields]]
key = "ext_ap_next_procedure"
label = "Next procedure (drives the specific risks)"
section = "Plan"
type = "multiselect"
options = [
  "simple extraction",
  "surgical extraction",
  "alveoloplasty",
  "socket preservation",
  "incision and drainage",
  "periapical biopsy",
  "***",
]

[[fields]]
key = "ext_ap_anesthesia_plan"
label = "Anesthesia (ends the next procedure line)"
section = "Plan"
type = "dropdown"
default = "Local"
options = [
  { label = "Local", text = "local anesthesia" },
  { label = "Nitrous", text = "local anesthesia with nitrous oxide" },
  { label = "IV sedation", text = "IV sedation; NPO and escort instructions reviewed" },
  { label = "General anesthesia", text = "general anesthesia; NPO and escort instructions reviewed" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_antibiotics"
label = "Antibiotics"
section = "Plan"
type = "dropdown"
options = [
  { label = "Amoxicillin", text = "amoxicillin 500 mg PO TID for 7 days" },
  { label = "Clindamycin", text = "clindamycin 300 mg PO QID for 7 days (penicillin allergy)" },
  { label = "Preop prophylaxis", text = "amoxicillin 2 g PO 1 hour prior to surgery" },
  { label = "None", text = "not indicated" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_analgesia"
label = "Analgesia"
section = "Plan"
type = "dropdown"
options = [
  { label = "Ibuprofen + APAP", text = "ibuprofen 600 mg PO q6h and acetaminophen 500 mg PO q6h as needed" },
  { label = "APAP only", text = "acetaminophen 1000 mg PO q6h as needed, not to exceed 3 g per day" },
  { label = "With opioid", text = "ibuprofen 600 mg PO q6h and acetaminophen 500 mg PO q6h as needed, with [[ext_ap_opioid_dose_and_quantity]] for breakthrough pain" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_opioid_dose_and_quantity"
label = "Opioid, dose and quantity"
section = "Plan"
type = "text"
default = "***"
visible_if = "ext_ap_analgesia == 'With opioid'"

[[fields]]
key = "ext_ap_chlorhexidine_bullet"
label = "Chlorhexidine rinse"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_tobacco_bullet"
label = "+ Tobacco cessation (automatic for current tobacco use)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_cannabis_bullet"
label = "+ Cannabis before sedation (automatic for cannabis use with sedation)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_ocp_bullet"
label = "+ Oral contraceptive counseling (automatic for oral contraceptive use)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_anticoag_bullet"
label = "+ Anticoagulation plan (automatic for anticoagulants)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_bleeding_bullet"
label = "+ Hematology (automatic for bleeding disorder)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_diabetes_bullet"
label = "+ A1c / PCP (automatic for diabetes)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_antiresorptive_bullet"
label = "+ MRONJ precautions (automatic for antiresorptives)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_radiation_bullet"
label = "+ ORN precautions (automatic for H&N radiation)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_prophylaxis_bullet"
label = "+ Antibiotic prophylaxis (automatic for cardiac/joint)"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_clearance_timing"
label = "Clearance timing"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "ext_ap_replacement_plan"
label = "Tooth replacement"
section = "Plan"
type = "dropdown"
options = [
  { label = "Implant consult", text = "implant evaluation after socket healing" },
  { label = "Immediate denture", text = "immediate denture fabricated by the restoring dentist prior to surgery" },
  { label = "Delayed prosthesis", text = "prosthesis by the restoring dentist after healing" },
  { label = "Not desired", text = "not desired at this time" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_consent_bullet"
label = "Consent at surgery"
section = "Plan"
type = "checkbox"
default = true

[[fields]]
key = "ext_ap_follow_up"
label = "Follow-up"
section = "Plan"
type = "dropdown"
options = [
  { label = "24-48 hours", text = "24-48 hours after surgery" },
  { label = "1 week", text = "1 week after surgery" },
  { label = "2 weeks", text = "2 weeks after surgery" },
  { label = "As needed", text = "as needed" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_ap_next_step"
label = "Next step"
section = "Plan"
type = "dropdown"
options = [
  { label = "Urgent", text = "Schedule urgently; return precautions reviewed for worsening swelling, fever, trismus, or difficulty swallowing or breathing." },
  { label = "Completed today", text = "Extraction completed today; see procedure note." },
  { label = "Pending clearance", text = "Schedule after medical clearance is received." },
  { label = "***", text = "***" },
]
