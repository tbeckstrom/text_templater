# SNIPPET: clinic_assessment_plan_third_molar   PREFIX: tm_ap
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# "Next procedure" drives the coronectomy and surgical-approach sentences, its
# plan bullet and the specific risks. Risk factors from the history add their
# plan bullets automatically (each can also be ticked by hand). Plan lines are
# left out until picked ("***" is a deliberate choice). The pathway presets
# that fill this section live in the note.
name = "Snippet: Assessment & plan - third molar consult"
use_partials = ["common_extraction_case", "clinic_risks_third_molar"]

body = """
{%- set np = tm_ap_next_procedure -%}
{%- set alts = tm_ap_alternatives_text -%}
{%- set coronectomy = "coronectomy" in np or tm_ap_coronectomy_sentence -%}
{%- set teeth = ext_teeth_tooth_word ~ " " ~ ext_teeth_list -%}
{%- set lines = [
  ("Next procedure: " ~ ((np[:-1] | join(sep=", ")) ~ " and " ~ np[-1] if np | length > 1 else np | first) ~ ", " ~ teeth ~ ".") if np else "",
  ("Anesthesia: " ~ tm_ap_anesthesia_plan_text ~ ".") if tm_ap_anesthesia_plan else "",
  ("Antibiotics: " ~ tm_ap_antibiotics_text ~ ".") if tm_ap_antibiotics else "",
  ("Analgesia: " ~ tm_ap_analgesia_text | replace(from="[[tm_ap_opioid_dose_and_quantity]]", to=tm_ap_opioid_dose_and_quantity) ~ ".") if tm_ap_analgesia else "",
  "Chlorhexidine 0.12% rinse BID beginning the day after surgery for 1 week." if tm_ap_chlorhexidine_bullet else "",
  "Work or school note provided." if tm_ap_work_note else "",
  "Tobacco cessation counseling provided; advised to avoid smoking for at least 72 hours after surgery to reduce the risk of dry socket." if tm_ap_tobacco_bullet or (ext_hx_tobacco_use is defined and ext_hx_tobacco_use in ["current", "vaping"]) else "",
  "Increased dry socket risk with oral contraceptive use reviewed." if tm_ap_ocp_bullet or (ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and "Oral contraceptives" in ext_hx_other_risks) else "",
  "Perioperative anticoagulant/antiplatelet management to be coordinated with the prescribing provider; local hemostatic measures planned." if tm_ap_anticoag_bullet or (ext_hx_anticoag_use is defined and ext_hx_anticoag_use == "Yes") else "",
  "Hemostatic management to be coordinated with hematology prior to surgery." if tm_ap_bleeding_bullet or (ext_hx_bleeding_disorder is defined and ext_hx_bleeding_disorder == "Yes") else "",
  "Recent A1c and PCP clearance requested prior to surgery." if tm_ap_diabetes_bullet or (ext_hx_diabetes_status is defined and ext_hx_diabetes_status == "Yes") else "",
  "MRONJ precautions: atraumatic technique with primary closure where feasible, and close follow-up until mucosal healing." if tm_ap_antiresorptive_bullet or (ext_hx_antiresorptive is defined and ext_hx_antiresorptive in ["Oral bisphosphonate", "IV BP / denosumab"]) else "",
  "Radiation oncology records requested to confirm dose to the surgical sites; ORN precautions with atraumatic technique, primary closure, and close follow-up." if tm_ap_radiation_bullet or (ext_hx_hn_radiation is defined and ext_hx_hn_radiation == "Yes") else "",
  "Antibiotic prophylaxis per current AHA or orthopedic guidance." if tm_ap_prophylaxis_bullet or (ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and ("Cardiac prophylaxis" in ext_hx_other_risks or "Prosthetic joint" in ext_hx_other_risks)) else "",
  ("Consult note sent to " ~ ext_ref_name ~ ".") if tm_ap_consult_letter else "",
  ("Written informed consent to be reviewed and signed by " ~ ext_dm_phrase ~ " at the surgical visit.") if tm_ap_consent_bullet else "",
  ("Follow-up: " ~ tm_ap_follow_up_text ~ ".") if tm_ap_follow_up else "",
  tm_ap_next_step_text if tm_ap_next_step else "",
] -%}
**ASSESSMENT:**
{{ ext_pt_intro }} presenting with {% for v in tm_ap_problems_text %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %}{% if not tm_ap_problems %}***{% endif %} of {{ teeth }}.{% if tm_ap_extraction_rec %} Extraction of {{ teeth }} is recommended.{% endif %}{% if tm_ap_rationale_text %} {{ tm_ap_rationale_text | join(sep=" ") }}{% endif %}{% if coronectomy %} Given the close proximity of the roots to the inferior alveolar canal, coronectomy of tooth {{ tm_ap_fdi_tooth_for_coronectomy }} is recommended to reduce the risk of inferior alveolar nerve injury. The risks of root migration and a possible second surgery were discussed.{% endif %}{% if "surgical extraction" in np %} A surgical approach with sectioning of the crown and bone removal as needed is anticipated.{% endif %}{% if alts %}
Alternatives reviewed: {% if alts | length > 1 %}{{ alts[:-1] | join(sep="; ") }}; and {{ alts[-1] }}{% else %}{{ alts | first }}{% endif %}.{% endif %}
{% include "clinic_risks_third_molar" %}
After shared decision making, {{ ext_dm_phrase }} {{ tm_ap_patient_decision_text if tm_ap_patient_decision else "***" }}

**PLAN:**
{%- for l in lines %}{% if l %}
- {{ l }}{% endif %}{% endfor %}"""

# ------------------------------------------------------------- assessment ---

[[fields]]
key = "tm_ap_problems"
label = "Problems"
section = "Assessment & plan - third molar consult"
type = "multiselect"
options = [
  { label = "Impaction", text = "impaction" },
  { label = "Pericoronitis", text = "recurrent pericoronitis" },
  { label = "Caries", text = "caries" },
  { label = "Pericoronal pathology", text = "pericoronal pathology" },
  { label = "Insufficient space", text = "insufficient space for eruption" },
  { label = "***", text = "***" },
]
default = ["Impaction"]

[[fields]]
key = "tm_ap_extraction_rec"
label = "Extraction recommended"
section = "Assessment & plan - third molar consult"
type = "checkbox"
default = true

[[fields]]
key = "tm_ap_rationale"
label = "Rationale"
section = "Assessment & plan - third molar consult"
type = "multiselect"
options = [
  { label = "Pericoronitis", text = "Extraction will eliminate the source of recurrent pericoronal infection." },
  { label = "Second molar", text = "Removal will reduce the risk of caries and periodontal disease affecting the adjacent second molar." },
  { label = "Pathology", text = "Removal will eliminate the risk of a pericoronal cyst or other associated pathology." },
  { label = "Ortho", text = "Removal is required to allow the planned orthodontic or orthognathic treatment." },
  { label = "Prophylactic", text = "In the absence of symptoms, removal was discussed as a means of reducing the likelihood of future pericoronitis, caries, periodontal disease, or pathology, with generally lower surgical risk and faster recovery at a younger age." },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_ap_coronectomy_sentence"
label = "+ Coronectomy discussion"
section = "Assessment & plan - third molar consult"
type = "checkbox"
default = false

[[fields]]
key = "tm_ap_fdi_tooth_for_coronectomy"
label = "FDI tooth for coronectomy"
section = "Assessment & plan - third molar consult"
type = "text"
default = "***"
visible_if = "'coronectomy' in tm_ap_next_procedure or tm_ap_coronectomy_sentence"

[[fields]]
key = "tm_ap_alternatives"
label = "Alternatives reviewed"
section = "Assessment & plan - third molar consult"
type = "multiselect"
options = [
  { label = "Observation", text = "observation with periodic clinical and radiographic surveillance" },
  { label = "Coronectomy", text = "coronectomy (partial tooth removal to reduce the risk of nerve injury)" },
  { label = "Complete removal", text = "complete removal (higher risk of inferior alveolar nerve injury)" },
  { label = "No treatment", text = "no treatment (risk of recurrent infection, caries, and pathology)" },
  { label = "***", text = "***" },
]
default = ["Observation", "No treatment"]

[[fields]]
key = "tm_ap_patient_decision"
label = "Patient decision"
section = "Assessment & plan - third molar consult"
type = "dropdown"
default = "Proceed"
options = [
  { label = "Proceed", text = "wishes to proceed with the recommended treatment." },
  { label = "Considering", text = "wishes to consider the options discussed and will contact the office when ready." },
  { label = "Declines", text = "declines treatment at this time; the consequences of no treatment were reviewed." },
  { label = "***", text = "***" },
]

# ------------------------------------------------------------------- plan ---

[[fields]]
key = "tm_ap_next_procedure"
label = "Next procedure (drives the specific risks)"
section = "Plan"
type = "multiselect"
options = [
  "extraction",
  "surgical extraction",
  "coronectomy",
  "incision and drainage",
  "***",
]
default = ["surgical extraction"]

[[fields]]
key = "tm_ap_anesthesia_plan"
label = "Anesthesia"
section = "Plan"
type = "dropdown"
default = "IV sedation"
options = [
  { label = "Local", text = "local anesthesia" },
  { label = "Nitrous", text = "local anesthesia with nitrous oxide" },
  { label = "IV sedation", text = "local anesthesia with IV sedation; NPO and escort instructions reviewed" },
  { label = "General anesthesia", text = "general anesthesia; NPO and escort instructions reviewed" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_ap_antibiotics"
label = "Antibiotics"
section = "Plan"
type = "dropdown"
options = [
  { label = "Amoxicillin", text = "amoxicillin 500 mg PO TID for 7 days" },
  { label = "Clindamycin", text = "clindamycin 300 mg PO QID for 7 days (penicillin allergy)" },
  { label = "Not indicated", text = "not indicated" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_ap_analgesia"
label = "Analgesia"
section = "Plan"
type = "dropdown"
options = [
  { label = "Ibuprofen + APAP", text = "ibuprofen 600 mg PO q6h and acetaminophen 500 mg PO q6h as needed" },
  { label = "APAP only", text = "acetaminophen 1000 mg PO q6h as needed, not to exceed 3 g per day" },
  { label = "With opioid", text = "ibuprofen 600 mg PO q6h and acetaminophen 500 mg PO q6h as needed, with [[tm_ap_opioid_dose_and_quantity]] for breakthrough pain" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_ap_opioid_dose_and_quantity"
label = "Opioid, dose and quantity"
section = "Plan"
type = "text"
default = "***"
visible_if = "tm_ap_analgesia == 'With opioid'"

[[fields]]
key = "tm_ap_chlorhexidine_bullet"
label = "Chlorhexidine rinse"
section = "Plan"
type = "checkbox"
default = false

[[fields]]
key = "tm_ap_work_note"
label = "Work/school note"
