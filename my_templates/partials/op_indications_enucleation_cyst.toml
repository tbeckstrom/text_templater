# SNIPPET: op_indications_enucleation_cyst   PREFIX: enuc
# Generated from the snippet language — see .claude/skills/snippet-to-toml.
name = "Snippet: Indications – enucleation & curettage"
body = """
{%- set enuc_bone_graft_types_joined %}{% for v in enuc_bone_graft_types %}{% if not loop.first %}{% if loop.last %} and {% else %}, {% endif %}{% endif %}{{ v }}{% endfor %}{% endset -%}
Given the presence of a {{ enuc_lesion_description_text | replace(from="[[enuc_diagnosis]]", to=enuc_diagnosis) }} of the {{ enuc_laterality }} {{ enuc_maxilla_mandible }} with potential for continued expansion and structural compromise of adjacent structures, definitive surgical management was recommended.

Enucleation with curettage was advised in order to remove the pathologic tissue, obtain definitive histopathologic diagnosis, and reduce the risk of lesion progression while minimizing surgical morbidity.{% if enuc_optional_adds_text %} {{ enuc_optional_adds_text | join(sep=" ") | replace(from="[[enuc_tooth]]", to=enuc_tooth) | replace(from="[[enuc_teeth]]", to=enuc_teeth) | replace(from="[[enuc_proceed_defer]]", to=enuc_proceed_defer) | replace(from="[[enuc_bone_graft_types]]", to=enuc_bone_graft_types_joined) }}{% endif %}

The risks, benefits, and alternatives to operative management, including observation, were discussed with the patient. After discussion, the decision was made to proceed with enucleation and curettage of the {{ enuc_lesion_type }} lesion with grafting of the residual defect.
"""

[[fields]]
key = "enuc_lesion_description"
label = "Lesion description"
section = "Indications – enucleation & curettage"
type = "dropdown"
required = true
options = [
  { label = "Radiolucent lesion", text = "radiolucent lesion" },
  { label = "Biopsy proven", text = "biopsy proven [[enuc_diagnosis]]" },
]

[[fields]]
key = "enuc_diagnosis"
label = "Diagnosis"
section = "Indications – enucleation & curettage"
type = "text"
default = "***"
visible_if = "enuc_lesion_description == 'Biopsy proven'"

[[fields]]
key = "enuc_laterality"
label = "Laterality"
section = "Indications – enucleation & curettage"
type = "dropdown"
required = true
options = ["right", "left", "bilateral"]

[[fields]]
key = "enuc_maxilla_mandible"
label = "Maxilla / mandible"
section = "Indications – enucleation & curettage"
type = "dropdown"
required = true
options = ["maxilla", "mandible"]

[[fields]]
key = "enuc_optional_adds"
label = "Optional adds"
section = "Indications – enucleation & curettage"
type = "multiselect"
options = [
  { label = "Extraction Single", text = "Given the intimate association of the lesion with tooth #[[enuc_tooth]], extraction of this tooth was discussed as a potential measure to reduce risk of recurrence and facilitate complete lesion removal. The patient elected to [[enuc_proceed_defer]] the proposed extraction after discussion of the risks and benefits." },
  { label = "Extraction Multiple", text = "Given the intimate association of the lesion with teeth #[[enuc_teeth]], extraction of these teeth was discussed as a potential measure to reduce risk of recurrence and facilitate complete lesion removal. The patient elected to [[enuc_proceed_defer]] the proposed extractions after discussion of the risks and benefits." },
  { label = "Possible RCT / Ext in future", text = "The potential need for future endodontic therapy or extractions was discussed given the proximity of the lesion and anticipated instrumentation near the roots of adjacent teeth." },
  { label = "Bone Grafting", text = "Given the anticipated residual bony defect following removal of the lesion, grafting of the defect with [[enuc_bone_graft_types]] was planned." },
  { label = "Adjunctive 5-FU", text = "Adjunctive local therapy with application of 5-fluorouracil to the surgical site to reduce recurrence risk was discussed as part of surgical management." },
]

[[fields]]
key = "enuc_tooth"
label = "Tooth #"
section = "Indications – enucleation & curettage"
type = "text"
default = "***"
visible_if = "'Extraction Single' in enuc_optional_adds"

[[fields]]
key = "enuc_teeth"
label = "Teeth #"
section = "Indications – enucleation & curettage"
type = "text"
default = "***"
visible_if = "'Extraction Multiple' in enuc_optional_adds"

[[fields]]
key = "enuc_proceed_defer"
label = "Proceed / defer"
section = "Indications – enucleation & curettage"
type = "dropdown"
required = true
options = ["proceed with", "defer"]
visible_if = "'Extraction Single' in enuc_optional_adds or 'Extraction Multiple' in enuc_optional_adds"

[[fields]]
key = "enuc_bone_graft_types"
label = "Bone graft types"
section = "Indications – enucleation & curettage"
type = "multiselect"
options = ["particulate allograft", "particulate xenograft", "BMP", "autogenous bone graft"]
visible_if = "'Bone Grafting' in enuc_optional_adds"

[[fields]]
key = "enuc_lesion_type"
label = "Lesion type"
section = "Indications – enucleation & curettage"
type = "text"
default = "***"
