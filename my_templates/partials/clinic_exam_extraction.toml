# SNIPPET: clinic_exam_extraction   PREFIX: ext_exam
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# Every line is left out of the note until something is picked; "***" is a
# deliberate choice, never the fallback. One box per tooth to extract. The
# sedation evaluation is always shown, and its lines drop out until picked.
name = "Snippet: Exam - extraction consult"
use_partials = ["common_extraction_case"]

body = """
{%- set eo = [
  ("face " ~ ext_exam_face_swelling_text | replace(from="[[ext_exam_region_e_g_left_buccal_space]]", to=ext_exam_region_e_g_left_buccal_space)) if ext_exam_face_swelling else "",
  ("cervical lymph nodes " ~ ext_exam_lymph_nodes) if ext_exam_lymph_nodes else "",
  ("floor of mouth " ~ ext_exam_floor_of_mouth) if ext_exam_floor_of_mouth else "",
  ext_exam_voice_swallowing_text if ext_exam_voice_swallowing else "",
  ("TMJs " ~ ext_exam_tmj_status) if ext_exam_tmj_status else "",
] -%}
{%- set eo = [p for p in eo if p] -%}
{%- set airway = [
  ("Mallampati " ~ ext_exam_mallampati) if ext_exam_mallampati else "",
  ("BMI " ~ ext_exam_bmi) if ext_exam_bmi else "",
  ("neck " ~ ext_exam_neck_mobility) if ext_exam_neck_mobility else "",
] -%}
{%- set airway = [p for p in airway if p] -%}
{%- set lines = [
  ("Extraoral: " ~ eo | join(sep="; ")) if ext_exam_extraoral_exam and eo else "",
  ("Oral hygiene: " ~ ext_exam_oral_hygiene) if ext_exam_oral_hygiene else "",
  ("Periodontal status: " ~ ext_exam_perio_status_text | replace(from="[[ext_exam_periodontal_findings]]", to=ext_exam_periodontal_findings)) if ext_exam_perio_status else "",
  ("Soft tissues: " ~ ext_exam_soft_tissue_text) if ext_exam_soft_tissue else "",
  ("Opening: " ~ ext_exam_mouth_opening_text | replace(from="[[ext_exam_mio_mm]]", to=ext_exam_mio_mm)) if ext_exam_mouth_opening else "",
] -%}
{%- set sedation = [
  ("ASA class: " ~ ext_exam_asa_class) if ext_exam_asa_class else "",
  ("Airway: " ~ airway | join(sep="; ")) if airway else "",
] -%}
{%- for l in lines %}{% if l %}- {{ l }}
{% endif %}{% endfor %}
{%- for b in ext_exam_teeth %}{% if b.conditions %}- Tooth {{ b.tooth }}: {{ (b.conditions[:-1] | join(sep=", ")) ~ " and " ~ b.conditions[-1] if b.conditions | length > 1 else b.conditions | first }}
{% endif %}{% endfor %}
{%- for l in sedation %}{% if l %}- {{ l }}
{% endif %}{% endfor %}"""

# ---------------------------------------------------------- general exam ---

[[fields]]
key = "ext_exam_extraoral_exam"
label = "+ Extraoral exam"
section = "Exam - extraction consult"
type = "checkbox"
default = false

[[fields]]
key = "ext_exam_face_swelling"
label = "Face"
section = "Exam - extraction consult"
type = "dropdown"
default = "Symmetric"
options = [
  { label = "Symmetric", text = "symmetric without swelling" },
  { label = "Swelling", text = "swelling of the [[ext_exam_region_e_g_left_buccal_space]]" },
  { label = "***", text = "***" },
]
visible_if = "ext_exam_extraoral_exam"

[[fields]]
key = "ext_exam_region_e_g_left_buccal_space"
label = "Region, e.g. left buccal space"
section = "Exam - extraction consult"
type = "text"
default = "***"
visible_if = "ext_exam_extraoral_exam and ext_exam_face_swelling == 'Swelling'"

[[fields]]
key = "ext_exam_lymph_nodes"
label = "Cervical lymph nodes"
section = "Exam - extraction consult"
type = "dropdown"
default = "nonpalpable"
options = ["nonpalpable", "palpable and tender", "***"]
visible_if = "ext_exam_extraoral_exam"

[[fields]]
key = "ext_exam_floor_of_mouth"
label = "Floor of mouth"
section = "Exam - extraction consult"
type = "dropdown"
default = "soft"
options = ["soft", "elevated", "***"]
visible_if = "ext_exam_extraoral_exam"

[[fields]]
key = "ext_exam_voice_swallowing"
label = "Voice / swallowing"
section = "Exam - extraction consult"
type = "dropdown"
default = "Normal"
options = [
  { label = "Normal", text = "normal voice and swallowing without respiratory distress" },
  { label = "Dysphagia", text = "dysphagia without respiratory distress" },
  { label = "***", text = "***" },
]
visible_if = "ext_exam_extraoral_exam"

[[fields]]
key = "ext_exam_tmj_status"
label = "TMJs"
section = "Exam - extraction consult"
type = "dropdown"
default = "non-tender without clicking or crepitus"
options = ["non-tender without clicking or crepitus", "with clicking", "***"]
visible_if = "ext_exam_extraoral_exam"

[[fields]]
key = "ext_exam_oral_hygiene"
label = "Oral hygiene"
section = "Exam - extraction consult"
type = "dropdown"
default = "good"
options = ["good", "fair", "poor", "***"]

[[fields]]
key = "ext_exam_perio_status"
label = "Periodontal status"
section = "Exam - extraction consult"
type = "dropdown"
options = [
  { label = "Healthy", text = "periodontium healthy, without generalized inflammation or mobility" },
  { label = "Gingivitis", text = "generalized gingival inflammation without evidence of attachment loss" },
  { label = "Periodontitis", text = "periodontitis, [[ext_exam_periodontal_findings]]" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_exam_periodontal_findings"
label = "Periodontal findings (optional)"
section = "Exam - extraction consult"
type = "text"
default = ""
visible_if = "ext_exam_perio_status == 'Periodontitis'"

[[fields]]
key = "ext_exam_soft_tissue"
label = "Soft tissues"
section = "Exam - extraction consult"
type = "dropdown"
default = "WNL"
options = [
  { label = "WNL", text = "within normal limits, without masses or lesions" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_exam_mouth_opening"
label = "Opening"
section = "Exam - extraction consult"
type = "dropdown"
default = "Adequate"
options = [
  { label = "Adequate", text = "adequate" },
  { label = "Limited", text = "limited, maximal interincisal opening [[ext_exam_mio_mm]] mm" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_exam_mio_mm"
label = "MIO mm"
section = "Exam - extraction consult"
type = "text"
default = "***"
visible_if = "ext_exam_mouth_opening == 'Limited'"

[[speed_buttons]]
label = "Healthy perio"
section = "Exam - extraction consult"
values = { ext_exam_perio_status = "Healthy" }

# ------------------------------------------------ one box per tooth ---

[[groups]]
key = "ext_exam_teeth"
label = "Tooth"
source = "ext_extract_teeth"
source_as = "tooth"
section = "Exam - extraction consult"

[[groups.speed_buttons]]
label = "Abscessed"
values = { conditions = ["grossly carious", "tender to percussion", "with vestibular swelling"] }

[[groups.speed_buttons]]
label = "Perio hopeless"
values = { conditions = ["periodontally involved", "mobile"] }

[[groups.fields]]
key = "conditions"
label = "Conditions"
type = "multiselect"
options = [
  "grossly carious",
  "fractured",
  "retained root",
  "periodontally involved",
  "mobile",
  "tender to percussion",
  "with vestibular swelling",
  "with sinus tract",
  "***",
]

# ------------------------------------------------ sedation evaluation ---

[[fields]]
key = "ext_exam_asa_class"
label = "ASA class"
section = "Sedation evaluation"
type = "dropdown"
options = ["I", "II", "III", "IV", "***"]

[[fields]]
key = "ext_exam_mallampati"
label = "Mallampati"
section = "Sedation evaluation"
type = "dropdown"
options = ["I", "II", "III", "IV", "***"]

[[fields]]
key = "ext_exam_bmi"
label = "BMI (optional)"
section = "Sedation evaluation"
type = "text"
default = ""

[[fields]]
key = "ext_exam_neck_mobility"
label = "Neck"
section = "Sedation evaluation"
type = "dropdown"
options = ["full range of motion", "limited extension", "***"]
