# SNIPPET: clinic_exam_third_molar   PREFIX: tm_exam
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# Every line is left out of the note until something is picked; "***" is a
# deliberate choice, never the fallback. One box per tooth to extract, each
# always printing its line. The probing line covers the second molar next to
# each charted third molar. The sedation evaluation shows only when the plan
# is IV sedation or general anesthesia, preset to normal.
name = "Snippet: Exam - third molar consult"
use_partials = ["common_extraction_case"]

body = """
{%- set eo = [
  ("face " ~ tm_exam_face_status_text | replace(from="[[tm_exam_swelling_region_e_g_left_buccal_space]]", to=tm_exam_swelling_region_e_g_left_buccal_space)) if tm_exam_face_status else "",
  ("cervical lymph nodes " ~ tm_exam_lymph_nodes) if tm_exam_lymph_nodes else "",
  ("TMJs " ~ tm_exam_tmj_status) if tm_exam_tmj_status else "",
] -%}
{%- set eo = [p for p in eo if p] -%}
{%- set airway = [
  ("Mallampati " ~ tm_exam_mallampati) if tm_exam_mallampati else "",
  ("BMI " ~ tm_exam_bmi) if tm_exam_bmi else "",
  ("neck " ~ tm_exam_neck_mobility) if tm_exam_neck_mobility else "",
] -%}
{%- set airway = [p for p in airway if p] -%}
{%- set lines = [
  ("Oral hygiene: " ~ tm_exam_oral_hygiene) if tm_exam_oral_hygiene else "",
  ("Soft tissues: " ~ tm_exam_soft_tissues_text) if tm_exam_soft_tissues else "",
  ("Opening: " ~ tm_exam_mouth_opening_text | replace(from="[[tm_exam_mio_mm]]", to=tm_exam_mio_mm)) if tm_exam_mouth_opening else "",
  ("Extraoral/TMJ: " ~ eo | join(sep="; ")) if tm_exam_extraoral_exam and eo else "",
] -%}
{%- set sedation = [
  ("ASA class: " ~ tm_exam_asa_class) if tm_exam_asa_class else "",
  ("Airway: " ~ airway | join(sep="; ")) if airway else "",
] -%}
{%- set adj = tm_exam_adjacent_second_molars -%}
{%- set wnl = [t for t in adj if t not in tm_exam_deep_pd] -%}
{%- set deep = [t for t in adj if t in tm_exam_deep_pd] -%}
{%- set probing = [
  ("PD WNL at distal " ~ ("sites" if wnl | length > 1 else "site") ~ " of " ~ ((wnl[:-1] | join(sep=", ")) ~ " and " ~ wnl[-1] if wnl | length > 1 else wnl | first)) if wnl else "",
  ("PD 5+ mm at distal of " ~ ((deep[:-1] | join(sep=", ")) ~ " and " ~ deep[-1] if deep | length > 1 else deep | first)) if deep else "",
] -%}
{%- set probing = [p for p in probing if p] -%}
{%- set sedated = tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ["IV sedation", "General anesthesia"] -%}
{%- for l in lines %}{% if l %}- {{ l }}
{% endif %}{% endfor %}
{%- for b in tm_exam_teeth %}
{%- set parts = [
  b.eruption if b.eruption else "***",
  (b.tooth_findings_text[:-1] | join(sep=", ") ~ " and " ~ b.tooth_findings_text[-1] if b.tooth_findings_text | length > 1 else b.tooth_findings_text | first) if b.tooth_findings else "",
  b.other_finding if b.other_finding else "",
] -%}
{%- set parts = [p for p in parts if p] -%}
- Tooth {{ b.tooth }}: {{ parts | join(sep="; ") }}
{% endfor %}
{%- if probing %}- {{ probing | join(sep="; ") }}
{% endif %}
{%- if sedated %}{% for l in sedation %}{% if l %}- {{ l }}
{% endif %}{% endfor %}{% endif %}"""

# ---------------------------------------------------------- general exam ---

[[fields]]
key = "tm_exam_oral_hygiene"
label = "Oral hygiene"
section = "Exam - third molar consult"
type = "dropdown"
default = "good"
options = ["good", "fair", "poor", "***"]

[[fields]]
key = "tm_exam_soft_tissues"
label = "Soft tissues"
section = "Exam - third molar consult"
type = "dropdown"
default = "WNL"
options = [
  { label = "WNL", text = "within normal limits, without masses or lesions" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_exam_mouth_opening"
label = "Opening"
section = "Exam - third molar consult"
type = "dropdown"
default = "Adequate"
options = [
  { label = "Adequate", text = "adequate" },
  { label = "Limited", text = "limited, maximal interincisal opening [[tm_exam_mio_mm]] mm" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tm_exam_mio_mm"
label = "MIO mm"
section = "Exam - third molar consult"
type = "text"
default = "***"
visible_if = "tm_exam_mouth_opening == 'Limited'"

# ------------------------------------------------ extraoral / TMJ (add-on) ---

[[fields]]
key = "tm_exam_extraoral_exam"
label = "+ Extraoral/TMJ exam"
section = "Exam - third molar consult"
type = "checkbox"
default = true

[[fields]]
key = "tm_exam_face_status"
label = "Face"
section = "Exam - third molar consult"
type = "dropdown"
default = "Symmetric"
options = [
  { label = "Symmetric", text = "symmetric without swelling" },
  { label = "Swelling", text = "swelling of the [[tm_exam_swelling_region_e_g_left_buccal_space]]" },
  { label = "***", text = "***" },
]
visible_if = "tm_exam_extraoral_exam"

[[fields]]
key = "tm_exam_swelling_region_e_g_left_buccal_space"
label = "Swelling region, e.g. left buccal space"
section = "Exam - third molar consult"
type = "text"
default = "***"
visible_if = "tm_exam_extraoral_exam and tm_exam_face_status == 'Swelling'"

[[fields]]
key = "tm_exam_lymph_nodes"
label = "Cervical lymph nodes"
section = "Exam - third molar consult"
type = "dropdown"
options = ["nonpalpable", "palpable and tender", "***"]
visible_if = "tm_exam_extraoral_exam"

[[fields]]
key = "tm_exam_tmj_status"
label = "TMJs"
section = "Exam - third molar consult"
type = "dropdown"
options = ["non-tender without clicking or crepitus", "with clicking", "with crepitus", "***"]
visible_if = "tm_exam_extraoral_exam"

# ------------------------------------------------ one box per tooth ---

[[groups]]
key = "tm_exam_teeth"
label = "Tooth"
source = "ext_extract_teeth"
source_as = "tooth"
section = "Exam - third molar consult"

[[groups.speed_buttons]]
label = "Partial, pericoronitis"
values = { eruption = "partially erupted", tooth_findings = ["Pericoronitis", "Operculum inflamed"] }

[[groups.speed_buttons]]
label = "Gingiva-covered"
values = { eruption = "gingiva-covered", tooth_findings = [] }

[[groups.fields]]
key = "eruption"
label = "Eruption"
type = "dropdown"
default = "not visible"
options = ["fully erupted", "partially erupted", "gingiva-covered", "not visible", "***"]

[[groups.fields]]
key = "tooth_findings"
label = "Findings"
type = "multiselect"
options = [
  { label = "Pericoronitis", text = "pericoronitis" },
  { label = "Operculum inflamed", text = "inflamed operculum" },
  { label = "Carious", text = "carious" },
  { label = "Tender", text = "tender to percussion" },
  { label = "Opposing trauma", text = "opposing tooth traumatizing tissue" },
  { label = "Distal 2nd molar defect", text = "distal defect of the adjacent second molar" },
  { label = "***", text = "***" },
]

[[groups.fields]]
key = "other_finding"
label = "Other finding (blank = omitted)"
type = "text"
default = ""

# ------------------------------------------------ adjacent second molars ---

[[fields]]
key = "tm_exam_adjacent_second_molars"
label = "Adjacent second molars"
section = "Exam - third molar consult"
type = "computed"
visible_if = "false"
compute = '[t for t in ["17" if "18" in ext_extract_teeth else "", "27" if "28" in ext_extract_teeth else "", "37" if "38" in ext_extract_teeth else "", "47" if "48" in ext_extract_teeth else ""] if t]'

[[fields]]
key = "tm_exam_deep_pd"
label = "PD 5+ mm at distal of"
section = "Exam - third molar consult"
type = "multiselect"
options = ["17", "27", "37", "47"]

# ------------------------------------------------ sedation evaluation ---

[[fields]]
key = "tm_exam_asa_class"
label = "ASA class"
section = "Sedation evaluation"
type = "dropdown"
default = "I"
options = ["I", "II", "III", "IV", "***"]
visible_if = "tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ['IV sedation', 'General anesthesia']"

[[fields]]
key = "tm_exam_mallampati"
label = "Mallampati"
section = "Sedation evaluation"
type = "dropdown"
default = "I"
options = ["I", "II", "III", "IV", "***"]
visible_if = "tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ['IV sedation', 'General anesthesia']"

[[fields]]
key = "tm_exam_bmi"
label = "BMI (optional)"
section = "Sedation evaluation"
type = "text"
default = ""
visible_if = "tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ['IV sedation', 'General anesthesia']"

[[fields]]
key = "tm_exam_neck_mobility"
label = "Neck"
section = "Sedation evaluation"
type = "dropdown"
default = "full range of motion"
options = ["full range of motion", "limited extension", "***"]
visible_if = "tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ['IV sedation', 'General anesthesia']"
