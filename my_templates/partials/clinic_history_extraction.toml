# SNIPPET: clinic_history_extraction   PREFIX: ext_hx
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# Risk factors default to "no"; each one feeds its specific risk and plan
# bullet in the assessment & plan.
name = "Snippet: History - extraction consult"

body = """
**PAST MEDICAL HISTORY:**
{{ ext_hx_pmh }}

**MEDICATIONS:**
{{ ext_hx_meds }}

**ALLERGIES:**
{{ ext_hx_allergy }}

**EXTRACTION RISK FACTORS:**
{%- set lines = [
  ("Anticoagulant/antiplatelet: " ~ ext_hx_anticoag_use_text | replace(from="[[ext_hx_anticoagulant_antiplatelet_agent]]", to=ext_hx_anticoagulant_antiplatelet_agent)) if ext_hx_anticoag_use else "",
  ("Bleeding disorder: " ~ ext_hx_bleeding_disorder_text | replace(from="[[ext_hx_bleeding_disorder_2]]", to=ext_hx_bleeding_disorder_2)) if ext_hx_bleeding_disorder else "",
  ("Antiresorptive therapy: " ~ ext_hx_antiresorptive_text | replace(from="[[ext_hx_agent_duration_last_dose]]", to=ext_hx_agent_duration_last_dose)) if ext_hx_antiresorptive else "",
  ("Head and neck radiation: " ~ ext_hx_hn_radiation_text | replace(from="[[ext_hx_site_dose_date]]", to=ext_hx_site_dose_date)) if ext_hx_hn_radiation else "",
  ("Diabetes: " ~ ext_hx_diabetes_status_text | replace(from="[[ext_hx_a1c]]", to=ext_hx_a1c)) if ext_hx_diabetes_status else "",
  ("Tobacco: " ~ ext_hx_tobacco_use) if ext_hx_tobacco_use else "",
  ("Other: " ~ ext_hx_other_risks_text | join(sep=", ")) if ext_hx_other_risk_factors and ext_hx_other_risks else "",
] -%}
{% for l in lines %}{% if l %}
- {{ l }}{% endif %}{% endfor %}
"""

[[fields]]
key = "ext_hx_pmh"
label = "Past medical history"
section = "Past medical history"
type = "textarea"
default = "***"

[[fields]]
key = "ext_hx_meds"
label = "Medications"
section = "Medications"
type = "textarea"
default = "***"

[[fields]]
key = "ext_hx_allergy"
label = "Allergies"
section = "Allergies"
type = "textarea"
default = "***"

[[fields]]
key = "ext_hx_anticoag_use"
label = "Anticoagulant / antiplatelet"
section = "Extraction risk factors"
type = "dropdown"
default = "No"
options = [
  { label = "No", text = "no" },
  { label = "Yes", text = "[[ext_hx_anticoagulant_antiplatelet_agent]]" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_hx_anticoagulant_antiplatelet_agent"
label = "Anticoagulant/antiplatelet agent"
section = "Extraction risk factors"
type = "text"
default = "***"
visible_if = "ext_hx_anticoag_use == 'Yes'"

[[fields]]
key = "ext_hx_bleeding_disorder"
label = "Bleeding disorder"
section = "Extraction risk factors"
type = "dropdown"
default = "No"
options = [
  { label = "No", text = "no" },
  { label = "Yes", text = "[[ext_hx_bleeding_disorder_2]]" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_hx_bleeding_disorder_2"
label = "Bleeding disorder"
section = "Extraction risk factors"
type = "text"
default = "***"
visible_if = "ext_hx_bleeding_disorder == 'Yes'"

[[fields]]
key = "ext_hx_antiresorptive"
label = "Antiresorptive therapy"
section = "Extraction risk factors"
type = "dropdown"
default = "No"
options = [
  { label = "No", text = "no" },
  { label = "Oral bisphosphonate", text = "oral bisphosphonate, [[ext_hx_agent_duration_last_dose]]" },
  { label = "IV BP / denosumab", text = "parenteral antiresorptive therapy, [[ext_hx_agent_duration_last_dose]]" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_hx_agent_duration_last_dose"
label = "Agent, duration, last dose"
section = "Extraction risk factors"
type = "text"
default = "***"
visible_if = "ext_hx_antiresorptive in ['Oral bisphosphonate', 'IV BP / denosumab']"

[[fields]]
key = "ext_hx_hn_radiation"
label = "Head and neck radiation"
section = "Extraction risk factors"
type = "dropdown"
default = "No"
options = [
  { label = "No", text = "no" },
  { label = "Yes", text = "yes, [[ext_hx_site_dose_date]]" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_hx_site_dose_date"
label = "Site, dose, date"
section = "Extraction risk factors"
type = "text"
default = "***"
visible_if = "ext_hx_hn_radiation == 'Yes'"

[[fields]]
key = "ext_hx_diabetes_status"
label = "Diabetes"
section = "Extraction risk factors"
type = "dropdown"
default = "No"
options = [
  { label = "No", text = "no" },
  { label = "Yes", text = "diabetes mellitus, most recent A1c [[ext_hx_a1c]]%" },
  { label = "***", text = "***" },
]

[[fields]]
key = "ext_hx_a1c"
label = "A1c %"
section = "Extraction risk factors"
type = "text"
default = "***"
visible_if = "ext_hx_diabetes_status == 'Yes'"

[[fields]]
key = "ext_hx_tobacco_use"
label = "Tobacco"
section = "Extraction risk factors"
type = "dropdown"
default = "no"
options = ["no", "former", "current", "vaping", "***"]

[[fields]]
key = "ext_hx_other_risk_factors"
label = "+ Other risk factors"
section = "Extraction risk factors"
type = "checkbox"
default = false

[[fields]]
key = "ext_hx_other_risks"
label = "Other risk factors"
section = "Extraction risk factors"
type = "multiselect"
options = [
  { label = "Immunosuppression", text = "immunosuppression" },
  { label = "Chemotherapy", text = "current chemotherapy" },
  { label = "Oral contraceptives", text = "oral contraceptive use" },
  { label = "Prosthetic joint", text = "prosthetic joint" },
  { label = "Cardiac prophylaxis", text = "cardiac condition requiring antibiotic prophylaxis" },
  { label = "***", text = "***" },
]
visible_if = "ext_hx_other_risk_factors"

[[speed_buttons]]
label = "Healthy: noncontributory / none / NKDA"
section = "Past medical history"
values = { ext_hx_pmh = "Noncontributory", ext_hx_meds = "None", ext_hx_allergy = "NKDA" }

[[speed_buttons]]
label = "Noncontributory"
section = "Past medical history"
values = { ext_hx_pmh = "Noncontributory" }

[[speed_buttons]]
label = "None"
section = "Medications"
values = { ext_hx_meds = "None" }

[[speed_buttons]]
label = "NKDA"
section = "Allergies"
values = { ext_hx_allergy = "NKDA" }

[[speed_buttons]]
label = "Penicillin"
section = "Allergies"
values = { ext_hx_allergy = "Penicillin (***)" }
