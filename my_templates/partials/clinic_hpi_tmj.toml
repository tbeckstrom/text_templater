# SNIPPET: clinic_hpi_tmj   PREFIX: tmj_hpi
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# The one-liner is followed by short sentences that each drop out until
# picked or typed.
name = "Snippet: HPI - TMJ consult"
use_partials = ["common_tmj_case"]

body = """
{%- set details = [
  ("Symptoms began " ~ tmj_hpi_onset_how_long_ago ~ " ago.") if tmj_hpi_onset_how_long_ago else "",
  tmj_hpi_onset_mode_text if tmj_hpi_onset_mode else "",
  ("Pain is " ~ ((tmj_hpi_pain_character[:-1] | join(sep=", ")) ~ " and " ~ tmj_hpi_pain_character[-1] if tmj_hpi_pain_character | length > 1 else tmj_hpi_pain_character | first) ~ ".") if tmj_hpi_pain_character else "",
  ("Pain is " ~ ((tmj_hpi_pain_pattern[:-1] | join(sep=", ")) ~ " and " ~ tmj_hpi_pain_pattern[-1] if tmj_hpi_pain_pattern | length > 1 else tmj_hpi_pain_pattern | first) ~ ".") if tmj_hpi_pain_pattern else "",
  ("Pain is rated " ~ tmj_hpi_pain_at_worst_10 ~ "/10 at worst.") if tmj_hpi_pain_at_worst_10 else "",
  ("Symptoms are aggravated by " ~ ((tmj_hpi_aggravating[:-1] | join(sep=", ")) ~ " and " ~ tmj_hpi_aggravating[-1] if tmj_hpi_aggravating | length > 1 else tmj_hpi_aggravating | first) ~ ".") if tmj_hpi_aggravating else "",
  ("Associated symptoms include " ~ ((tmj_hpi_associated_symptoms_text[:-1] | join(sep=", ")) ~ " and " ~ tmj_hpi_associated_symptoms_text[-1] if tmj_hpi_associated_symptoms_text | length > 1 else tmj_hpi_associated_symptoms_text | first) ~ ".") if tmj_hpi_associated_symptoms else "",
  "Prior joint clicking stopped when limited opening began." if tmj_hpi_click_to_lock else "",
  ("Prior treatment has included " ~ ((tmj_hpi_prior_treatment[:-1] | join(sep=", ")) ~ " and " ~ tmj_hpi_prior_treatment[-1] if tmj_hpi_prior_treatment | length > 1 else tmj_hpi_prior_treatment | first) ~ ".") if tmj_hpi_prior_treatment else "",
  tmj_hpi_treatment_relief_text if tmj_hpi_treatment_relief else "",
] -%}
{%- set details = [d for d in details if d] -%}
Reason for visit: {{ tmj_hpi_visit_reason_text }}{% if tmj_referring_provider %}
Referring provider: {{ tmj_referring_provider }}{% endif %}
**HPI:**
{{ tmj_pt_intro }} presenting for evaluation of {{ tmj_complaint_side }} TMJ region pain.{% if details %} {{ details | join(sep=" ") }}{% endif %}
"""

[[fields]]
key = "tmj_hpi_visit_reason"
label = "Reason for visit"
section = "HPI - TMJ consult"
type = "dropdown"
default = "TMJ pain"
options = [
  { label = "TMJ pain", text = "Evaluation of TMJ pain" },
  { label = "Pain and clicking", text = "Evaluation of jaw pain and clicking" },
  { label = "Limited opening", text = "Evaluation of jaw pain and limited opening" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tmj_hpi_onset_how_long_ago"
label = "Onset, how long ago"
section = "HPI - TMJ consult"
type = "text"
default = ""

[[fields]]
key = "tmj_hpi_onset_mode"
label = "Onset"
section = "HPI - TMJ consult"
type = "dropdown"
options = [
  { label = "Gradual", text = "Onset was gradual." },
  { label = "Sudden", text = "Onset was sudden." },
  { label = "After trauma", text = "Onset followed jaw or facial trauma." },
  { label = "After dental tx", text = "Onset followed dental treatment." },
  { label = "After wide opening", text = "Onset followed prolonged or wide opening." },
  { label = "***", text = "***" },
]

[[fields]]
key = "tmj_hpi_pain_character"
label = "Pain character"
section = "HPI - TMJ consult"
type = "multiselect"
options = ["aching", "sharp", "throbbing", "***"]

[[fields]]
key = "tmj_hpi_pain_pattern"
label = "Pain pattern"
section = "HPI - TMJ consult"
type = "multiselect"
options = ["constant", "intermittent", "worse on waking", "worse later in the day", "***"]

[[fields]]
key = "tmj_hpi_pain_at_worst_10"
label = "Pain at worst, /10"
section = "HPI - TMJ consult"
type = "text"
default = ""

[[fields]]
key = "tmj_hpi_aggravating"
label = "Aggravated by"
section = "HPI - TMJ consult"
type = "multiselect"
options = ["chewing", "wide opening", "yawning", "talking", "clenching", "***"]

[[fields]]
key = "tmj_hpi_associated_symptoms"
label = "Associated symptoms"
section = "HPI - TMJ consult"
type = "multiselect"
options = [
  { label = "Clicking", text = "joint clicking" },
  { label = "Grinding", text = "joint grinding" },
  { label = "Catching/locking", text = "intermittent catching or locking" },
  { label = "Limited opening", text = "difficulty opening fully" },
  { label = "Bite change", text = "a change in the bite" },
  { label = "Ear symptoms", text = "ear pain or fullness" },
  { label = "Tinnitus", text = "tinnitus" },
  { label = "Headaches", text = "headaches" },
  { label = "Neck pain", text = "neck pain" },
  { label = "***", text = "***" },
]

[[fields]]
key = "tmj_hpi_click_to_lock"
label = "Clicking stopped, now limited"
section = "HPI - TMJ consult"
type = "checkbox"
default = false

[[fields]]
key = "tmj_hpi_prior_treatment"
label = "Prior treatment"
section = "HPI - TMJ consult"
type = "multiselect"
options = ["NSAIDs", "a muscle relaxant", "a night guard", "physical therapy", "injections", "***"]

[[fields]]
key = "tmj_hpi_treatment_relief"
label = "Relief from prior treatment"
section = "HPI - TMJ consult"
type = "dropdown"
options = [
  { label = "No relief", text = "This provided no relief." },
  { label = "Minimal relief", text = "This provided minimal relief." },
  { label = "Partial relief", text = "This provided partial relief." },
  { label = "Good relief", text = "This provided good but incomplete relief." },
  { label = "***", text = "***" },
]
