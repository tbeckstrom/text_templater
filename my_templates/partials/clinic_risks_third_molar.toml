# SNIPPET: clinic_risks_third_molar   PREFIX: tm_risk
# Generated from the snippet language - see .claude/skills/snippet-to-toml.
# General surgical risks, then the risks specific to the planned procedure:
# those of each component picked under "Next procedure" in the plan, of the
# charted teeth (nerve, sinus), of the history risk factors, and of sedation.
# Anything missing can be added by checkbox.
# The risk list is built once, in the hidden computed fields below, so the
# note and the printed sheet read the same list.
name = "Snippet: Risks - third molar extraction"
use_partials = ["common_extraction_case"]

body = """
{%- set specific = tm_risk_specific -%}
Risks, benefits, and alternatives were discussed with {{ ext_dm_phrase }}. Risks reviewed:
- General surgical: {{ tm_risk_general }}.{% if specific %}
- Specific to the planned procedure: {% if specific | length > 1 %}{{ specific[:-1] | join(sep="; ") }}; and {{ specific[-1] }}{% else %}{{ specific | first }}{% endif %}.{% endif %}
It was explained that outcomes cannot be guaranteed. All questions were answered, and {{ ext_dm_phrase }} verbalized understanding.{% if ext_decision_maker in ["Parent", "Legal guardian", "Healthcare POA"] %} The patient participated in the discussion to the extent of their ability.{% endif %}"""

# ------------------------------------------------------------ risk list ---
# Built once here for both the note and the printed sheet (where each risk
# is a tick-box). Hidden in the form (visible_if = "false").

[[fields]]
key = "tm_risk_next"
label = "Next procedure components"
section = "Risks - third molar extraction"
type = "computed"
visible_if = "false"
compute = 'tm_ap_next_procedure if tm_ap_next_procedure is defined else []'

[[fields]]
key = "tm_risk_general"
label = "General surgical"
section = "Risks - third molar extraction"
type = "computed"
visible_if = "false"
print = true
compute = '"bleeding, infection, pain, swelling, bruising, delayed healing, and the possible need for additional procedures"'

[[fields]]
key = "tm_risk_specific"
label = "Specific to the planned procedure"
section = "Risks - third molar extraction"
type = "computed"
visible_if = "false"
print = true
compute = '''[r for r in [
  "dry socket, damage to adjacent teeth or restorations, root fracture with possible retained root fragments, and postoperative jaw stiffness" if "extraction" in tm_risk_next or "surgical extraction" in tm_risk_next else "",
  "temporary or permanent altered sensation of the lip, chin, tongue, or gingiva from inferior alveolar or lingual nerve injury" if (tm_risk_next and ext_mand_posterior) or "Nerve injury" in tm_risk_added_risks else "",
  "oroantral communication that may require additional repair" if (tm_risk_next and ext_max_posterior) or "Sinus communication" in tm_risk_added_risks else "",
  "jaw fracture" if ("surgical extraction" in tm_risk_next and ext_mand_posterior) or "Jaw fracture" in tm_risk_added_risks else "",
  "root migration, a possible second surgery, and infection or pain from the retained roots" if "coronectomy" in tm_risk_next or "Coronectomy risks" in tm_risk_added_risks else "",
  "a higher risk of dry socket with tobacco use" if ext_hx_tobacco_use is defined and ext_hx_tobacco_use in ["current", "vaping"] else "",
  "a higher risk of dry socket with oral contraceptive use" if ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and "Oral contraceptives" in ext_hx_other_risks else "",
  "medication-related osteonecrosis of the jaw" if (ext_hx_antiresorptive is defined and ext_hx_antiresorptive in ["Oral bisphosphonate", "IV BP / denosumab"]) or "MRONJ" in tm_risk_added_risks else "",
  "osteoradionecrosis" if ext_hx_hn_radiation is defined and ext_hx_hn_radiation == "Yes" else "",
  "prolonged bleeding requiring additional hemostatic measures" if (ext_hx_anticoag_use is defined and ext_hx_anticoag_use == "Yes") or (ext_hx_bleeding_disorder is defined and ext_hx_bleeding_disorder == "Yes") else "",
  "delayed healing and a higher risk of infection" if (ext_hx_diabetes_status is defined and ext_hx_diabetes_status == "Yes") or (ext_hx_other_risk_factors is defined and ext_hx_other_risks is defined and ext_hx_other_risk_factors and ("Immunosuppression" in ext_hx_other_risks or "Chemotherapy" in ext_hx_other_risks)) else "",
  "risks of sedation or general anesthesia, including airway compromise, aspiration, and nausea" if tm_ap_anesthesia_plan is defined and tm_ap_anesthesia_plan in ["IV sedation", "General anesthesia"] else "",
] if r] | unique'''

[[fields]]
key = "tm_risk_added_risks"
label = "Add specific risks (procedure, site, history and sedation risks are added automatically)"
section = "Risks - third molar extraction"
type = "multiselect"
options = ["Nerve injury", "Sinus communication", "Jaw fracture", "Coronectomy risks", "MRONJ"]
